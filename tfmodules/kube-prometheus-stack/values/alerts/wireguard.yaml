groups:
  - name: wireguard
    rules:
      - alert: WireguardPeerDown
        expr: (time() - wireguard_latest_handshake_seconds) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WireGuard peer down on {{ $labels.instance }}
          description: The WireGuard peer {{ $labels.endpoint }} on device {{ $labels.interface }} has not completed a handshake in the last 5 minutes.
