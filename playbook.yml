---
# this block defines roles which get run against the host machines which form part of our k8s cluster
- hosts: all
  roles:
    - omelette.hostname
    - omelette.auto-updates
    - omelette.ssh-users
    - role: xanmanning.k3s
      vars:
        k3s_become: true
        k3s_server:
          secrets-encryption: true
          kube-controller-manager-arg:
            - "bind-address=0.0.0.0"
          kube-proxy-arg:
            - "metrics-bind-address=0.0.0.0"
          kube-scheduler-arg:
            - "bind-address=0.0.0.0"
          etcd-expose-metrics: true
        k3s_agent:
          node_name: "{{ hostname }}"
    - omelette.storage
    - omelette.kubeconfig
  become: true

# the roles defined in this section are for roles which run on the cluster, rather than the individual hosts
- hosts: localhost
  gather_facts: no
  vars:
    kubeconfig:
      apiVersion: v1
      kind: Config
      current-context: default
      contexts:
        - name: default
          context:
            cluster: default
            user: default
      clusters:
        - name: default
          cluster:
            server: "https://{{ hostvars[groups.all[0]].ansible_ssh_host }}:6443"
            certificate-authority-data: "{{ hostvars[groups.all[0]].kubeconfig_ca_data }}"
      users:
        - name: default
          user:
            client-certificate-data: "{{ hostvars[groups.all[0]].kubeconfig_client_cert_data }}"
            client-key-data: "{{ hostvars[groups.all[0]].kubeconfig_client_key_data }}"

  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig }}"
      validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    group/kubernetes.core.helm:
      kubeconfig: "{{ kubeconfig }}"
      validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    group/community.general.keycloak:
      auth_keycloak_url: "{{ keycloak_url }}"
      auth_username: "{{ keycloak_username }}"
      auth_password: "{{ keycloak_password }}"
      auth_realm: master
      validate_certs: "{{ kubeconfig_require_secure|default(true) }}"

  roles:
    - omelette.storage
    - omelette.monitoring
    - omelette.postgres
    - omelette.cert-manager
    - omelette.sso
    - omelette.secrets
    - omelette.external-dns
    - omelette.apps
    - omelette.factorio
    - omelette.planka
