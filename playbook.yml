---
- hosts: all
  roles:
    - omelette.auto-updates
    - omelette.firewall
    - omelette.users
    - xanmanning.k3s
    - omelette.k3s-networking
    - omelette.kubeconfig
  become: true

- hosts: localhost
  gather_facts: no
  vars:
    kubeconfig:
      apiVersion: v1
      kind: Config
      current-context: default
      contexts:
        - name: default
          context:
            cluster: default
            user: default
      clusters:
        - name: default
          cluster:
            server: "https://{{ hostvars.default.ansible_ssh_host }}:6443"
            certificate-authority-data: "{{ hostvars.default.kubeconfig_ca_data }}"
      users:
        - name: default
          user:
            client-certificate-data: "{{ hostvars.default.kubeconfig_client_cert_data }}"
            client-key-data: "{{ hostvars.default.kubeconfig_client_key_data }}"

  tasks:
    - name: Add prometheus-community repo
      kubernetes.core.helm_repository:
        name: prometheus-community
        repo_url: https://prometheus-community.github.io/helm-charts

    - name: install kube-prometheus
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig }}"
        validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
        name: kube-prometheus
        chart_ref: prometheus-community/kube-prometheus-stack
        release_namespace: monitoring
        create_namespace: true
