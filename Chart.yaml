apiVersion: v2
name: gitops
version: 0.0.1
description: This is not a real Helm chart - it only exists so Dependabot can update it, the versions are then read by Ansible to make sure the versions we're deploying are stable.
type: application
dependencies:
  - name: cert-manager
    version: 1.18.2
    repository: https://charts.jetstack.io/
  - name: external-dns
    version: 1.18.0
    repository: https://kubernetes-sigs.github.io/external-dns/
  - name: external-secrets
    version: 0.19.1
    repository: https://charts.external-secrets.io/
  - name: factorio-server-charts
    version: 2.5.2
    repository: https://sqljames.github.io/factorio-server-charts/
  - name: keycloakx
    version: 7.0.1
    repository: https://codecentric.github.io/helm-charts/
  - name: kube-prometheus-stack
    version: 75.15.2
    repository: https://prometheus-community.github.io/helm-charts/
  - name: loki
    version: 6.35.0
    repository: https://grafana.github.io/helm-charts/
  - name: postgresql
    version: 16.7.21
    repository: https://charts.bitnami.com/bitnami/
  - name: promtail
    version: 6.17.0
    repository: https://grafana.github.io/helm-charts/
  - name: planka
    version: 1.0.3
    repository: http://plankanban.github.io/planka/
  - name: vault
    version: 0.30.1
    repository: https://helm.releases.hashicorp.com/
