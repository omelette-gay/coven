---
# this block defines roles which get run against the host machines which form part of our k8s cluster
- hosts: all
  roles:
    - omelette.hostbase
    - omelette.auto-updates
    - omelette.ssh-users
    - omelette.wireguard
    - omelette.k3s-backup
    - role: xanmanning.k3s
      vars:
        k3s_become: true
    - omelette.storage
  become: true
  any_errors_fatal: true
