---
- name: reboot k3s nodes if there are pending upgrades
  hosts: all
  serial: 1
  become: true

  tasks:
    - name: Check if node requires a reboot
      ansible.builtin.command: needs-restarting -r
      register: reboot_check
      failed_when: reboot_check.rc not in [0, 1]
      changed_when: false

    - name: Report status if no reboot is needed
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} does not require a reboot. Skipping."
      when: reboot_check.rc == 0

    - name: Drain, Reboot, and Uncordon Node
      when: reboot_check.rc == 1 # exit code 1 = reboot required
      block:
        - name: Gracefully switchover any CNPG primaries on this node
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            # Find all CNPG primaries running on this specific node and trigger switchover
            for pod in $(kubectl get pods -A -l cnpg.io/instanceRole=primary --field-selector spec.nodeName={{ k3s_agent['node-name'] }} -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.labels.cnpg\.io\/cluster}{"\n"}{end}'); do
              NS=$(echo $pod | cut -d'/' -f1)
              CLUSTER=$(echo $pod | cut -d'/' -f2)
              kubectl cnpg switchover $CLUSTER -n $NS
            done
          failed_when: false
          changed_when: false

        - name: Scale down matter server on grimhilde which blocks drain
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl -n home-assistant scale statefulset gs-home-assistant-matter-server --replicas=0
          failed_when: false
          when: inventory_hostname == "grimhilde"

        # After a node reboots, its Longhorn replicas are stale and get rebuilt from the other node over the WireGuard
        # tunnel, which can take a while. Until that finishes, the other node holds the only healthy replica, and
        # Longhorn's instance-manager PodDisruptionBudget blocks it from being drained. So wait for every attached
        # volume to be healthy before draining. (Detached volumes report "unknown" and don't block drains, so they're
        # ignored here.)
        - name: Wait for Longhorn volumes to be healthy before draining
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl -n longhorn-system get volumes.longhorn.io
            -o jsonpath='{range .items[?(@.status.state=="attached")]}{.metadata.name}={.status.robustness}{"\n"}{end}'
          register: longhorn_volumes
          until: >-
            longhorn_volumes.rc == 0 and
            (longhorn_volumes.stdout_lines | reject('search', '=healthy$') | list | length) == 0
          retries: 180 # 180 x 20s = 1 hour
          delay: 20
          changed_when: false

        - name: Drain node before reboot
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl drain {{ k3s_agent['node-name'] }}
            --ignore-daemonsets
            --delete-emptydir-data
            --force
            --timeout=30m
          register: drain_result
          changed_when: "'drained' in drain_result.stdout or 'cordoned' in drain_result.stdout"

        - name: Reboot the node
          ansible.builtin.reboot:
            msg: "Reboot triggered by rolling-reboot playbook"
            connect_timeout: 5
            reboot_timeout: 600
            pre_reboot_delay: 0
            post_reboot_delay: 15
            test_command: uptime

        - name: Wait for node to re-join and report Ready status
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl get node {{ k3s_agent['node-name'] }}
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
          register: node_ready
          until: node_ready.stdout == "True"
          retries: 30
          delay: 10

        - name: Uncordon the node
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl uncordon {{ k3s_agent['node-name'] }}
          register: uncordon_result
          changed_when: "'uncordoned' in uncordon_result.stdout"

        - name: Rebalance CNPG Standby pods if co-located on the same node
          delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            # Find standby pods running on the same node as their primary and delete them to force rescheduling
            for cluster in $(kubectl get clusters.postgresql.cnpg.io -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{"\n"}{end}'); do
              NS=$(echo $cluster | cut -d'/' -f1)
              NAME=$(echo $cluster | cut -d'/' -f2)
            
              # Get node of primary and standby
              PRIM_NODE=$(kubectl get pods -n $NS -l cnpg.io/cluster=$NAME,cnpg.io/instanceRole=primary -o jsonpath='{.items[0].spec.nodeName}')
              STDBY_POD=$(kubectl get pods -n $NS -l cnpg.io/cluster=$NAME,cnpg.io/instanceRole=replica -o jsonpath='{.items[0].metadata.name}')
              STDBY_NODE=$(kubectl get pods -n $NS -l cnpg.io/cluster=$NAME,cnpg.io/instanceRole=replica -o jsonpath='{.items[0].spec.nodeName}')
            
              if [ "$PRIM_NODE" = "$STDBY_NODE" ] && [ -n "$STDBY_POD" ]; then
                echo "Rebalancing standby $STDBY_POD in namespace $NS"
                kubectl delete pod $STDBY_POD -n $NS
              fi
            done
          failed_when: false
          changed_when: false

        - name: Scale up matter server on grimhilde which blocks drain
          delegate_to: localhost
          become: false
          ansible.builtin.command: >
            kubectl -n home-assistant scale statefulset gs-home-assistant-matter-server --replicas=1
          failed_when: false
          when: inventory_hostname == "grimhilde"
