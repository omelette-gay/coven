name: Plan a Terraform stack
description: >-
  Logs in, then checks, plans and renders one coven stack. The plan goes to a file, never the log, and is scanned with
  gitleaks before it leaves the job: if gitleaks finds anything, only the addresses and actions of the changes are
  kept, and the action fails. Writes plan.txt and outcomes.json to the artifact-path output for the comment job.

inputs:
  stack:
    description: The coven stack to plan, bootstrap, platform or apps
    required: true

outputs:
  artifact-path:
    description: The folder holding plan.txt and outcomes.json, to upload as an artifact
    value: ${{ steps.plan.outputs.artifact-path }}

runs:
  using: composite
  steps:
    - name: log in
      uses: ./.github/actions/terraform-login
      with:
        vault-role: coven-tfplan
        kubernetes-role: github-coven-tfplan

    # Renovate can't update the checksum, so gitleaks is updated by hand: take the linux_x64 line from the release's
    # checksums.txt, after checking the release is at least a few days old
    - name: install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        mkdir -p "$RUNNER_TEMP/gitleaks"
        cd "$RUNNER_TEMP/gitleaks"
        curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" gitleaks

    - name: plan
      id: plan
      shell: bash
      env:
        STACK: ${{ inputs.stack }}
      run: bash "$GITHUB_ACTION_PATH/plan.sh"

    - name: fail if the plan failed or gitleaks found something
      if: steps.plan.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::The plan failed, or gitleaks found something in it. The outcomes are in the pull request comment."
        exit 1
