name: Log in for Terraform
description: Logs in to Vault, the coven cluster and GCP, and sets up Terraform, so a stack can be planned or applied

runs:
  using: composite
  steps:
    - name: login to Vault
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: https://vault.coven.omelette.gay
        method: jwt
        path: github
        role: gitops
        exportToken: true
        # the bootstrap stack can't read Vault itself, so give it the Hetzner token through the environment
        secrets: |
          secret/data/gitops/hetzner api_token | HCLOUD_TOKEN

    - name: log in to k8s
      id: k8s_auth
      uses: omelette-gay/vault-k8s-login-action@fcbdf7dd6fd2b0c201e4c2923e9cec529abcd95c # v1
      with:
        vault-github-role: github-gitops
        vault-k8s-role: github-gitops
        vault-server: https://vault.coven.omelette.gay
        cluster-role-binding: "true"
        k8s-controller-url: https://strix.xdc.omelette.gay:6443
        k8s-controller-ca: |
          -----BEGIN CERTIFICATE-----
          MIIBdjCCAR2gAwIBAgIBADAKBggqhkjOPQQDAjAjMSEwHwYDVQQDDBhrM3Mtc2Vy
          dmVyLWNhQDE3MzM0NDE5MzkwHhcNMjQxMjA1MjMzODU5WhcNMzQxMjAzMjMzODU5
          WjAjMSEwHwYDVQQDDBhrM3Mtc2VydmVyLWNhQDE3MzM0NDE5MzkwWTATBgcqhkjO
          PQIBBggqhkjOPQMBBwNCAAStSdti1Jm75qbFBu/1/d/KUEr6g8Fv/Ppsq+sd8YNJ
          wzLdW8vlLn4GW9ScVwzkUP6l9uAOSCCtxSkS6LlPmj/xo0IwQDAOBgNVHQ8BAf8E
          BAMCAqQwDwYDVR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQUku8WL0M88576doqpq+Ie
          mZVIDV4wCgYIKoZIzj0EAwIDRwAwRAIgO+dcJF/aO0G0bRpYwX6sIzSoK4jD809f
          vCyvWCodXqQCIFn+wIsfK9e2QFftm/idiRRRhpqHVcP4F0HUaTuNNsz2
          -----END CERTIFICATE-----

    - name: write kubeconfig out
      shell: bash
      run: |
        mkdir ~/.kube
        cat >~/.kube/config <<EOF
        ${{ steps.k8s_auth.outputs.kubeconfig }}
        EOF

    - name: login to GCP
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: coven-omelette-gay
        workload_identity_provider: projects/211831137824/locations/global/workloadIdentityPools/omelette-gay-github-actions/providers/omelette-gay-github-actions

    # setup-terraform has no input for a version file, so read it here. Renovate keeps the file up to date
    - name: read the Terraform version
      id: terraform-version
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/.terraform-version")" >> "$GITHUB_OUTPUT"

    - name: setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.terraform-version.outputs.version }}
        # The wrapper copies all stdout/stderr into step outputs. Nothing reads them (tfplan.yml renders the
        # plan to a file instead), and keeping them invites passing huge strings around.
        terraform_wrapper: false
