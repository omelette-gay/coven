version: 2
updates:
  - package-ecosystem: helm
    directory: "/"
    open-pull-requests-limit: 100
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      regular-updates:
        update-types:
          - 'minor'
          - 'patch'
    versioning-strategy: increase

  - package-ecosystem: terraform
    directory: "coven/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      regular-updates:
        update-types:
          - 'minor'
          - 'patch'
