name: Apply Terraform changes

on:
  push:
    branches:
      - main
    paths:
      - "cloud-resources/**"

jobs:
  tfapply:
    name: apply Terraform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cloud-resources/
    concurrency:
      group: tfapply
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: login to Vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://vault.coven.omelette.gay
          method: jwt
          path: github
          role: gitops
          exportToken: true
      
      - name: login to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: coven-omelette-gay
          workload_identity_provider: projects/211831137824/locations/global/workloadIdentityPools/omelette-gay-github-actions/providers/omelette-gay-github-actions

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve -input=false
