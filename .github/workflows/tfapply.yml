name: Plan Terraform changes

on:
  push:
    branches:
        - master
    #paths:
    #  - "cloud-resources/**"

jobs:
  tfapply:
    name: "Apply Terraform changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: cloud-resources/
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to Vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://vault.coven.omelette.gay
          method: jwt
          path: github
          role: gitops
          exportToken: true
      
      - uses: 'google-github-actions/auth@v3'
        with:
          project_id: coven-omelette-gay
          workload_identity_provider: projects/211831137824/locations/global/workloadIdentityPools/omelette-gay-github-actions/providers/omelette-gay-github-actions

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -no-color -input=false
