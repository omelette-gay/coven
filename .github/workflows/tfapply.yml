name: Apply Terraform changes

on:
  push:
    branches:
      - main

# Covers every stack's job, so two merges can't apply at the same time
concurrency:
  group: coven-terraform
  cancel-in-progress: false

jobs:
  tfapply:
    name: apply Terraform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: coven/
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: log in
        uses: ./.github/actions/terraform-login

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve -input=false

  tfapply-apps:
    name: apply Terraform changes (apps)
    needs: tfapply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: coven/apps/
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: log in
        uses: ./.github/actions/terraform-login

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve -input=false
