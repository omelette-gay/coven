name: Apply Terraform changes

on:
  push:
    branches:
      - main

jobs:
  tfapply:
    name: apply Terraform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: coven/
    concurrency:
      group: coven-terraform
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: login to Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.coven.omelette.gay
          method: jwt
          path: github
          role: gitops
          exportToken: true

      - name: log in to k8s
        id: k8s_auth
        uses: omelette-gay/vault-k8s-login-action@v1
        with:
          vault-github-role: github-gitops
          vault-k8s-role: github-gitops
          vault-server: https://vault.coven.omelette.gay
          cluster-role-binding: "true"
          k8s-controller-url: https://strix.xdc.omelette.gay:6443
          k8s-controller-ca: |
            -----BEGIN CERTIFICATE-----
            MIIBdjCCAR2gAwIBAgIBADAKBggqhkjOPQQDAjAjMSEwHwYDVQQDDBhrM3Mtc2Vy
            dmVyLWNhQDE3MzM0NDE5MzkwHhcNMjQxMjA1MjMzODU5WhcNMzQxMjAzMjMzODU5
            WjAjMSEwHwYDVQQDDBhrM3Mtc2VydmVyLWNhQDE3MzM0NDE5MzkwWTATBgcqhkjO
            PQIBBggqhkjOPQMBBwNCAAStSdti1Jm75qbFBu/1/d/KUEr6g8Fv/Ppsq+sd8YNJ
            wzLdW8vlLn4GW9ScVwzkUP6l9uAOSCCtxSkS6LlPmj/xo0IwQDAOBgNVHQ8BAf8E
            BAMCAqQwDwYDVR0TAQH/BAUwAwEB/zAdBgNVHQ4EFgQUku8WL0M88576doqpq+Ie
            mZVIDV4wCgYIKoZIzj0EAwIDRwAwRAIgO+dcJF/aO0G0bRpYwX6sIzSoK4jD809f
            vCyvWCodXqQCIFn+wIsfK9e2QFftm/idiRRRhpqHVcP4F0HUaTuNNsz2
            -----END CERTIFICATE-----
      
      - name: write kubeconfig out
        run: |
          mkdir ~/.kube
          cat >~/.kube/config <<EOF
          ${{ steps.k8s_auth.outputs.kubeconfig }}
          EOF

      - name: login to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: coven-omelette-gay
          workload_identity_provider: projects/211831137824/locations/global/workloadIdentityPools/omelette-gay-github-actions/providers/omelette-gay-github-actions

      - name: setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve -input=false
