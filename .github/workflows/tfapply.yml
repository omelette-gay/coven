name: Deploy cluster configuration

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Covers every job, so two merges can't apply at the same time
concurrency:
  group: coven-terraform
  cancel-in-progress: false

permissions: {}

# Always main's copy of tfapply-stack.yml: only that copy gets credentials (ADR 006)
jobs:
  bootstrap:
    uses: omelette-gay/coven/.github/workflows/tfapply-stack.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      stack: bootstrap

  platform:
    needs: bootstrap
    uses: omelette-gay/coven/.github/workflows/tfapply-stack.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      stack: platform

  apps:
    needs: platform
    uses: omelette-gay/coven/.github/workflows/tfapply-stack.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      stack: apps
