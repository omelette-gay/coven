name: Apply a Terraform stack

on:
  workflow_call:
    inputs:
      stack:
        description: The root module to apply, e.g. coven/bootstrap
        required: true
        type: string
      timeout-minutes:
        description: Must be longer than the longest chain of Helm timeouts in the stack, so a Helm upgrade isn't killed part way through
        required: false
        type: number
        default: 60

jobs:
  tfapply:
    name: apply ${{ inputs.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.stack }}/
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: log in
        uses: ./.github/actions/terraform-login

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve -input=false -lock-timeout=10m
