name: Plan Terraform changes

on:
  pull_request:
    types: ["opened", "synchronize"]

jobs:
  tfplan:
    name: plan Terraform changes (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - coven/bootstrap
          - coven/platform
          - coven/apps
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ matrix.stack }}/
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: log in
        uses: ./.github/actions/terraform-login

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -lock=false -out=tfplan
        continue-on-error: true

      - name: render plan
        if: steps.plan.outcome == 'success'
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan: \`${{ matrix.stack }}\`"
            echo '```'
            head -c 900000 plan.txt   # the step summary is capped at 1 MiB
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: comment on PR
        uses: actions/github-script@v9
        env:
          STACK: ${{ matrix.stack }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const env = process.env;

            // 1. Read the rendered plan from disk, truncated to fit a GitHub comment (max 65,536 chars)
            const planPath = `${env.STACK}/plan.txt`;
            const MAX_PLAN = 60000;
            let plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : 'Plan failed, see the run log for details.';
            if (plan.length > MAX_PLAN) {
              plan = plan.slice(0, MAX_PLAN) + `\n\n... plan truncated, the full plan is in the job summary: ${env.RUN_URL}`;
            }

            // 2. Build the comment
            const header = `### Terraform: \`${env.STACK}\``;
            const body = [
              header,
              `#### Terraform Format and Style 🖌\`${env.FMT_OUTCOME}\``,
              `#### Terraform Initialization ⚙️\`${env.INIT_OUTCOME}\``,
              `#### Terraform Validation 🤖\`${env.VALIDATE_OUTCOME}\``,
              `#### Terraform Plan 📖\`${env.PLAN_OUTCOME}\``,
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `[Workflow run](${env.RUN_URL})`,
            ].join('\n');

            // 3. Update our existing comment for this stack, or create one
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(header));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: fail if Terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
