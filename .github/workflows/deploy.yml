name: Deploy to Coven
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: coven
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to Vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://vault.coven.omelette.gay
          method: jwt
          path: github
          role: gitops-ansible
          exportToken: true

      - name: provision SSH key
        run: echo -e "${{secrets.SSH_KEY}}" > ~/.ssh/id_ed25519

      - name: trust remote servers
        run: echo -e "${{secrets.SSH_KNOWN_HOSTS}}" > ~/.ssh/known_hosts

      - name: run Ansible
        run: ansible-playbook -u github -i inventory playbook.yml
