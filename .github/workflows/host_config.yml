name: Configure Coven hosts
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  configure:
    name: Configure Coven hosts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: coven
    concurrency:
      group: coven-ansible
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: connect to janus
        run: |
          sudo apt-get install -y wireguard

          cat <<EOF | sudo tee /etc/wireguard/wg0.conf >/dev/null
          [Interface]
          PrivateKey = ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          Address = 192.168.178.204/24,fd1e:6349:c40a::204/64
          MTU = 1392
          
          [Peer]
          PublicKey = ${{ secrets.WIREGUARD_SERVER_PUBLIC_KEY }}
          PresharedKey = ${{ secrets.WIREGUARD_SERVER_PRESHARED_KEY }}
          AllowedIPs = 192.168.178.0/24,fd1e:6349:c40a::/64
          Endpoint = janus.gs.omelette.gay:59384
          PersistentKeepalive = 25
          EOF
          
          sudo wg-quick up wg0

      - name: login to Vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.coven.omelette.gay
          method: jwt
          path: github
          role: gitops
          exportToken: true

      - name: provision SSH key
        run: |
          mkdir -p ~/.ssh
          echo -e "${{secrets.SSH_KEY}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "${{secrets.SSH_KNOWN_HOSTS}}" > ~/.ssh/known_hosts

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: install dependencies
        run: |
          uv sync --locked --all-extras --dev
          helm plugin install https://github.com/databus23/helm-diff
          uv run ansible-galaxy install -r requirements.yml

      - name: run Ansible
        run: uv run ansible-playbook -u github -i coven/inventory plays/configure-hosts.yml

      - name: close down Wireguard connection
        if: always()
        run: sudo wg-quick down wg0
