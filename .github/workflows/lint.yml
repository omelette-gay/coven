name: Lint

on:
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - "**.tf"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/**"

permissions:
  contents: read

jobs:
  lint:
    name: lint Terraform
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-terraform has no input for a version file, so read it here
      - name: read the Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      # The plan workflow only checks the formatting of each stack's own folder, not the modules in tfmodules/
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: setup TFLint
        if: ${{ !cancelled() }}
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint
        if: ${{ !cancelled() }}
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Every workflow and composite action, including the reusable workflows, which pull requests can't run with
  # credentials (ADR 006). The images are pinned by digest, and Renovate updates them.
  actions:
    name: lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

      # The token lets zizmor check that pinned commits really belong to each action's repository
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE:/repo" --workdir /repo
          ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
          --format github .github/
