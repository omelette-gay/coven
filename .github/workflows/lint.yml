name: Lint Terraform

on:
  pull_request:
    types: ["opened", "synchronize"]
    paths:
      - "**.tf"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  lint:
    name: lint Terraform
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-terraform has no input for a version file, so read it here
      - name: read the Terraform version
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      # The plan workflow only checks the formatting of each stack's own folder, not the modules in tfmodules/
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: setup TFLint
        if: ${{ !cancelled() }}
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint
        if: ${{ !cancelled() }}
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_MISCONFIG_SCANNERS: terraform
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
