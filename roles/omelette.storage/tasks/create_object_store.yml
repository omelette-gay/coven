- name: check if secret exists in Vault with object store credentials
  hashivault_read:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "object-store/{{ object_store.name }}"
    version: 2
  ignore_errors: true
  register: object_store_credentials

- name: create secret in Vault for object store credentials
  hashivault_secret:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "object-store/{{ object_store.name }}"
    data:
      RUSTFS_ACCESS_KEY: "{{ lookup('community.general.random_string', length=32, special=False) }}"
      RUSTFS_SECRET_KEY: "{{ lookup('community.general.random_string', length=32, special=False) }}"
  when: object_store_credentials.failed

- name: create secret from Vault for object store credentials
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "object-store/{{ object_store.name }}"
      k8s_secret_name: "{{ object_store.name }}-object-store-credentials"
      k8s_namespace: "{{ object_store.namespace }}"
      k8s_service_account_name: "{{ object_store.name }}-object-store-credentials"
      vault_role_name: "{{ object_store.name }}-object-store-credentials"

- name: install Rustfs
  kubernetes.core.helm:
    name: "{{ object_store.name }}-rustfs"
    chart_ref: rustfs
    chart_repo_url: "{{ lookup('helm_chart', 'rustfs').repository }}"
    chart_version: "{{ lookup('helm_chart', 'rustfs').version }}"
    release_namespace: "{{ object_store.namespace }}"
    release_values:
      mode:
        standalone:
          enabled: true
        distributed:
          enabled: false
      storageclass:
        name: longhorn
        dataStorageSize: "{{ object_store.size }}"
      ingress:
        enabled: false
      secret:
        existingSecret: "{{ object_store.name }}-object-store-credentials"
      config:
        rustfs:
          log_level: warn
    wait: true

- name: create required buckets
  kubernetes.core.k8s:
    name: "create-{{ object_store.name }}-bucket-{{ bucket }}"
    namespace: "{{ object_store.namespace }}"
    definition:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          spec:
            containers:
              - name: mc
                image: minio/mc:latest
                env:
                  - name: ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: "{{ object_store.name }}-object-store-credentials"
                        key: RUSTFS_ACCESS_KEY
                  - name: SECRET_KEY
                    valueFrom:
                      secretKeyRef:
                        name: "{{ object_store.name }}-object-store-credentials"
                        key: RUSTFS_SECRET_KEY
                command: [ "/bin/sh", "-c" ]
                args:
                  - |
                    mc alias set {{ object_store.name }} http://{{ object_store.name }}-rustfs-svc.{{ object_store.namespace }}.svc.cluster.local:9000 $ACCESS_KEY $SECRET_KEY;
                    
                    mc mb {{ object_store.name }}/{{ bucket }} --ignore-existing;
            restartPolicy: OnFailure
  loop: "{{ object_store.buckets }}"
  loop_control:
    loop_var: bucket
