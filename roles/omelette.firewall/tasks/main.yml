---
- name: allow SSH from trusted IPv4 networks
  firewalld:
    rich_rule: rule family="ipv4" source address="{{ item }}" service name="ssh" accept
    permanent: true
    state: enabled
  loop: "{{ trusted_ipv4_networks }}"

- name: allow SSH from trusted IPv6 networks
  firewalld:
    rich_rule: rule family="ipv6" source address="{{ item }}" service name="ssh" accept
    permanent: true
    state: enabled
  loop: "{{ trusted_ipv6_networks }}"

- name: disable SSH from all by default
  firewalld:
    service: ssh
    permanent: true
    state: disabled

- name: enable firewalld
  systemd:
    name: firewalld.service
    enabled: yes
    state: reloaded
