- name: Add external-dns repo
  kubernetes.core.helm_repository:
    name: external-dns
    repo_url: https://kubernetes-sigs.github.io/external-dns/

- name: install External DNS operator with Hetzner sync
  kubernetes.core.helm:
    name: hetzner
    chart_ref: external-dns/external-dns
    release_namespace: "{{ external_dns_k8s_namespace }}"
    create_namespace: true
    release_values:
      provider:
        name: webhook
        webhook:
          image:
            repository: ghcr.io/mconfalonieri/external-dns-hetzner-webhook
            tag: latest
          env:
            - name: HETZNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ external_dns_hetzner_k8s_secret_name }}"
                  key: api_key
          livenessProbe:
            httpGet:
              path: /health
              port: http-wh-metrics
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http-wh-metrics
            initialDelaySeconds: 10
            timeoutSeconds: 5

      serviceMonitor:
        enabled: true

      txtOwnerId: "{{ cluster_domain }}"

- name: create secret from Vault with Hetzner API key
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "{{ external_dns_hetzner_vault_secret_name }}"
      k8s_secret_name: "{{ external_dns_hetzner_k8s_secret_name }}"
      k8s_namespace: "{{ external_dns_k8s_namespace }}"
      k8s_service_account_name: "{{ external_dns_hetzner_k8s_secret_name }}-secret-reader"
      vault_role_name: "{{ external_dns_hetzner_k8s_secret_name }}-{{ external_dns_hetzner_k8s_secret_name }}"
