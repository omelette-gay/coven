- name: install External DNS operator with Hetzner sync
  kubernetes.core.helm:
    name: hetzner
    chart_ref: external-dns
    chart_repo_url: "{{ lookup('helm_chart', 'external-dns').repository }}"
    chart_version: "{{ lookup('helm_chart', 'external-dns').version }}"
    release_namespace: "{{ external_dns_k8s_namespace }}"
    create_namespace: true
    release_values:
      policy: sync
      provider:
        name: webhook
        webhook:
          image:
            repository: docker.io/hetzner/external-dns-hetzner-webhook
            # renovate: datasource=docker depName=docker.io/hetzner/external-dns-hetzner-webhook
            tag: v0.5.1
          env:
            - name: HETZNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "{{ external_dns_hetzner_k8s_secret_name }}"
                  key: api_token
      serviceMonitor:
        enabled: true

      txtOwnerId: "{{ cluster_domain }}"
    wait: true
  notify: restart Grafana

- name: create secret from Vault with Hetzner API key
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "{{ external_dns_hetzner_vault_secret_name }}"
      k8s_secret_name: "{{ external_dns_hetzner_k8s_secret_name }}"
      k8s_namespace: "{{ external_dns_k8s_namespace }}"
      k8s_service_account_name: "{{ external_dns_hetzner_k8s_secret_name }}-secret-reader"
      vault_role_name: "{{ external_dns_hetzner_k8s_secret_name }}-{{ external_dns_hetzner_k8s_secret_name }}"

- name: create records which are not managed by External DNS Operator
  hetzner.hcloud.zone_rrset:
    api_token: "{{ lookup('hashivault', external_dns_hetzner_vault_secret_name, 'api_token', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) }}"
    zone: "{{ item.zone }}"
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    records: "{{ item.records }}"
  loop: "{{ external_dns_extra_records }}"
