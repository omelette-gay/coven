- name: Add codecentric repo
  kubernetes.core.helm_repository:
    name: codecentric
    repo_url: https://codecentric.github.io/helm-charts

- name: create database secret if it doesn't exist
  kubernetes.core.k8s:
    name: "{{ keycloak_db_credentials_secret }}"
    namespace: keycloak
    definition:
      apiVersion: v1
      kind: Secret
      data:
        admin_password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
        password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
        replication_password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
  when: query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name=keycloak_db_credentials_secret, namespace='keycloak')|length == 0

- name: install database for Keycloak
  kubernetes.core.helm:
    name: keycloak-db
    chart_ref: oci://registry-1.docker.io/bitnamicharts/postgresql
    release_namespace: keycloak
    create_namespace: true
    release_values:
      global:
        postgresql:
          auth:
            username: keycloak
            database: keycloak
            password: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name=keycloak_db_credentials_secret, namespace='keycloak')[0].data.password|b64decode }}"
            existingSecret: "{{ keycloak_db_credentials_secret }}"
            secretKeys:
              adminPasswordKey: admin_password
              userPasswordKey: password
              replicationPasswordKey: replication_password
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true

- name: install Keycloak
  kubernetes.core.helm:
    name: keycloak
    chart_ref: codecentric/keycloakx
    release_namespace: keycloak
    create_namespace: true
    release_values:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true

      command:
        - "/opt/keycloak/bin/kc.sh"
        - "start"
        - "--http-port=8080"
        - "--hostname-strict=false"
      extraEnv: |
        - name: JAVA_OPTS_APPEND
          value: >-
            -Djgroups.dns.query=keycloak-keycloakx-headless
        - name: KC_PROXY
          value: "edge"
        - name: KC_HTTP_ENABLED
          value: "true"
        {% if bootstrap_keycloak|default(false) %}
        - name: KEYCLOAK_ADMIN
          value: {{ keycloak_username }}
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: {{ keycloak_password }}
        {% endif %}

      dbchecker:
        enabled: true

      database:
        vendor: postgres
        hostname: keycloak-db-postgresql
        port: 5432
        username: keycloak
        database: keycloak
        existingSecret: "{{ keycloak_db_credentials_secret }}"
        existingSecretKey: "password"

      # expose Keycloak to the public Internet
      ingress:
        enabled: true
        rules:
          - host: "{{ keycloak_host }}"
            paths:
              - path: /auth/
                pathType: Prefix
        annotations:
          cert-manager.io/cluster-issuer: "{{ certmanager_acme_issuer }}"
          traefik.ingress.kubernetes.io/router.middlewares: "{% if kubeconfig_require_secure|default(true) %}kube-system-redirect-https@kubernetescrd{% else %}{{ omit }}{% endif %}"
        tls:
          - hosts:
              - "{{ keycloak_host }}"
            secretName: keycloak-tls
    wait: true

- name: create omelette.gay realm in Keycloak
  community.general.keycloak_realm:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_username: "{{ keycloak_username }}"
    auth_password: "{{ keycloak_password }}"
    auth_realm: master
    validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    id: omelette-gay
    realm: "{{ keycloak_realm }}"
    enabled: true
    user_managed_access_allowed: true
    smtp_server:
      from: "keycloak@{{ cluster_domain }}"
      host: "{{ smtp_relay.host|default(omit) }}"
      port: "{{ smtp_relay.port|default(omit) }}"
      ssl: "{{ smtp_relay.ssl|default(omit) }}"

- name: create admin group for omelette.gay in Keycloak
  community.general.keycloak_group:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_username: "{{ keycloak_username }}"
    auth_password: "{{ keycloak_password }}"
    auth_realm: master
    validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ keycloak_admin_group }}"
    realm: "{{ keycloak_realm }}"
