- name: Add codecentric repo
  kubernetes.core.helm_repository:
    name: codecentric
    repo_url: https://codecentric.github.io/helm-charts

- name: create database secret if it doesn't exist
  kubernetes.core.k8s:
    name: "{{ keycloak_db_credentials_secret }}"
    namespace: keycloak
    definition:
      apiVersion: v1
      kind: Secret
      data:
        admin_password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
        password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
        replication_password: "{{ lookup('community.general.random_string', length=30)|b64encode }}"
  when: query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name=keycloak_db_credentials_secret, namespace='keycloak')|length == 0

- name: install database for Keycloak
  kubernetes.core.helm:
    name: keycloak-db
    chart_ref: oci://registry-1.docker.io/bitnamicharts/postgresql
    release_namespace: keycloak
    create_namespace: true
    release_values:
      global:
        postgresql:
          auth:
            username: keycloak
            database: keycloak
            password: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name=keycloak_db_credentials_secret, namespace='keycloak')[0].data.password|b64decode }}"
            existingSecret: "{{ keycloak_db_credentials_secret }}"
            secretKeys:
              adminPasswordKey: admin_password
              userPasswordKey: password
              replicationPasswordKey: replication_password
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true

- name: block Keycloak metrics endpoint from web
  kubernetes.core.k8s:
    name: block-metrics-path
    namespace: keycloak
    definition:
      apiVersion: traefik.containo.us/v1alpha1
      kind: Middleware
      spec:
        plugin:
          plugin-blockpath:
            Regex:
              - ^/auth/realms/([^/]*)/metrics(.*)

- name: install Keycloak
  kubernetes.core.helm:
    name: keycloak
    chart_ref: codecentric/keycloakx
    release_namespace: keycloak
    create_namespace: true
    release_values:
      command:
        - "/opt/keycloak/bin/kc.sh"
        - "start"
        - "--http-port=8080"
        - "--hostname={{ keycloak_url }}"
      extraEnv: |
        - name: JAVA_OPTS_APPEND
          value: >-
            -Djgroups.dns.query=keycloak-keycloakx-headless
        - name: KC_PROXY
          value: "edge"
        {% if bootstrap_keycloak|default(false) %}
        - name: KEYCLOAK_ADMIN
          value: {{ keycloak_username }}
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: {{ keycloak_password }}
        {% endif %}

      dbchecker:
        enabled: true

      database:
        vendor: postgres
        hostname: keycloak-db-postgresql
        port: 5432
        username: keycloak
        database: keycloak
        existingSecret: "{{ keycloak_db_credentials_secret }}"
        existingSecretKey: "password"

      # configure monitoring for Keycloak
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true

      # use the extra metrics-spi-provider plugin to expose realm metrics for Keycloak
      extraServiceMonitor:
        enabled: true
      service:
        extraPorts:
          - name: http-internal
            port: 9000
            targetPort: http-internal
      extraInitContainers: |
        - name: metrics-spi-provider
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
          args:
            - -c
            - |
              echo "Downloading metrics-spi-provider"
              wget -O /providers/keycloak-metrics-spi.jar https://github.com/aerogear/keycloak-metrics-spi/releases/download/{{ keycloak_metrics_spi_version }}/keycloak-metrics-spi-{{ keycloak_metrics_spi_version }}.jar
          volumeMounts:
            - name: providers
              mountPath: /providers
      extraVolumeMounts: |
        - name: providers
          mountPath: /opt/keycloak/providers
      extraVolumes: |
        - name: providers
          emptyDir: {}

      # expose Keycloak to the public Internet
      proxy:
        enabled: true
        mode: xforwarded
        http:
          enabled: true
      ingress:
        enabled: true
        rules:
          - host: "{{ keycloak_host }}"
            paths:
              - path: /auth/
                pathType: Prefix
        annotations:
          cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd,keycloak-block-metrics-path@kubernetescrd"
        tls:
          - hosts:
              - "{{ keycloak_host }}"
            secretName: keycloak-tls
    wait: true

- name: create omelette.gay realm in Keycloak
  community.general.keycloak_realm:
    id: omelette-gay
    realm: "{{ keycloak_realm }}"
    enabled: true
    user_managed_access_allowed: true
    smtp_server:
      from: "keycloak@{{ cluster_domain }}"
      host: "{{ smtp_relay.host|default(omit) }}"
      port: "{{ smtp_relay.port|default(omit) }}"
      ssl: "{{ smtp_relay.ssl|default(omit) }}"

- name: create admin group for omelette.gay in Keycloak
  community.general.keycloak_group:
    name: "{{ keycloak_admin_group }}"
    realm: "{{ keycloak_realm }}"
