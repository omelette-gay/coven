---
- name: create Keycloak k8s Namespace
  kubernetes.core.k8s:
    name: "{{ keycloak_k8s_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: sync GCP backup service account secret
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "backups/service-account-key"
      k8s_secret_name: "{{ keycloak_k8s_backup_creds_secret }}"
      k8s_namespace: "{{ keycloak_k8s_namespace }}"
      k8s_service_account_name: "keycloak-gcp-backup-creds"
      vault_role_name: "keycloak-gcp-backup-creds"
  when: bootstrap|default(false) == false

- name: install database for Keycloak
  kubernetes.core.helm:
    name: db
    chart_ref: cluster
    chart_repo_url: "{{ lookup('helm_chart', 'cluster').repository }}"
    chart_version: "{{ lookup('helm_chart', 'cluster').version }}"
    release_namespace: "{{ keycloak_k8s_namespace }}"
    release_values:
      version:
        postresql: "{{ cnpg_postgres_major_version }}"
      cluster:
        instances: 2
        initdb:
          database: keycloak
        monitoring:
          enabled: true
      backups:
        enabled: true
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
        provider: google
        google:
          bucket: "{{ gcp_backup_bucket_name }}"
          path: /cnpg/keycloak/
        secret:
          name: "{{ keycloak_k8s_backup_creds_secret }}"
          create: false
        scheduledBackups:
          - name: daily-backup
            schedule: "0 30 8,20 * * *"
            backupOwnerReference: self
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io
    wait: true

- name: block Keycloak metrics endpoint from web
  kubernetes.core.k8s:
    name: block-metrics-path
    namespace: "{{ keycloak_k8s_namespace }}"
    definition:
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      spec:
        plugin:
          plugin-blockpath:
            Regex:
              - ^/auth/realms/([^/]*)/metrics(.*)

- name: install Keycloak
  kubernetes.core.helm:
    name: keycloak
    chart_ref: keycloakx
    chart_repo_url: "{{ lookup('helm_chart', 'keycloakx').repository }}"
    chart_version: "{{ lookup('helm_chart', 'keycloakx').version }}"
    release_namespace: "{{ keycloak_k8s_namespace }}"
    release_values:
      command:
        - "/opt/keycloak/bin/kc.sh"
        - "start"
        - "--http-port=8080"
        - "--hostname={{ keycloak_url }}"
      extraEnv: |
        - name: JAVA_OPTS_APPEND
          value: >-
            -Djgroups.dns.query=keycloak-keycloakx-headless
        - name: KC_PROXY
          value: "edge"
        {% if bootstrap|default(false) %}
        - name: KEYCLOAK_ADMIN
          value: "{{ keycloak_username }}"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "{{ keycloak_password }}"
        {% endif %}

      dbchecker:
        enabled: true

      database:
        vendor: postgres
        hostname: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name='db-cluster-app', namespace='keycloak', kubeconfig=kubeconfig, validate_certs=kubeconfig_require_secure|default(true))[0].data.host|b64decode }}"
        port: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name='db-cluster-app', namespace='keycloak', kubeconfig=kubeconfig, validate_certs=kubeconfig_require_secure|default(true))[0].data.port|b64decode|int }}"
        database: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name='db-cluster-app', namespace='keycloak', kubeconfig=kubeconfig, validate_certs=kubeconfig_require_secure|default(true))[0].data.dbname|b64decode }}"
        username: "{{ query('kubernetes.core.k8s', api_version='v1', kind='Secret', resource_name='db-cluster-app', namespace='keycloak', kubeconfig=kubeconfig, validate_certs=kubeconfig_require_secure|default(true))[0].data.username|b64decode }}"
        existingSecret: db-cluster-app
        existingSecretKey: password

      # configure monitoring for Keycloak
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true

      # use the extra metrics-spi-provider plugin to expose realm metrics for Keycloak
      extraServiceMonitor:
        enabled: true
      extraInitContainers: |
        - name: metrics-spi-provider
          image: alpine:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
          args:
            - -c
            - |
              echo "Downloading metrics-spi-provider"
              wget -O /providers/keycloak-metrics-spi.jar https://github.com/aerogear/keycloak-metrics-spi/releases/download/{{ keycloak_metrics_spi_version }}/keycloak-metrics-spi-{{ keycloak_metrics_spi_version }}.jar
          volumeMounts:
            - name: providers
              mountPath: /providers
      extraVolumeMounts: |
        - name: providers
          mountPath: /opt/keycloak/providers
      extraVolumes: |
        - name: providers
          emptyDir: {}

      # expose Keycloak to the public Internet
      proxy:
        enabled: true
        mode: xforwarded
        http:
          enabled: true
      ingress:
        enabled: true
        rules:
          - host: "{{ keycloak_host }}"
            paths:
              - path: /auth/
                pathType: Prefix
        annotations:
          cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd,keycloak-block-metrics-path@kubernetescrd"
        tls:
          - hosts:
              - "{{ keycloak_host }}"
            secretName: keycloak-tls
    wait: true
  notify: restart Grafana

- name: create omelette.gay realm in Keycloak
  middleware_automation.keycloak.keycloak_realm:
    id: omelette-gay
    realm: "{{ keycloak_realm }}"
    enabled: true
    user_managed_access_allowed: true
    smtp_server:
      from: "keycloak@{{ cluster_domain }}"
      host: "{{ smtp_relay.host|default(omit) }}"
      port: "{{ smtp_relay.port|default(omit) }}"
      ssl: "{{ smtp_relay.ssl|default(omit) }}"

- name: create admin group for omelette.gay in Keycloak
  middleware_automation.keycloak.keycloak_group:
    name: "{{ keycloak_admin_group }}"
    realm: "{{ keycloak_realm }}"

- name: monitor Keycloak
  kubernetes.core.k8s:
    name: keycloak-https
    namespace: "{{ keycloak_k8s_namespace }}"
    api_version: monitoring.coreos.com/v1
    kind: Probe
    definition:
      spec:
        interval: 60s
        module: http_2xx
        prober:
          url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
          path: /probe
        targets:
          staticConfig:
            static:
              - "https://{{ keycloak_host }}/auth/realms/master/"
