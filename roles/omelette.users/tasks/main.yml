---
- name: add admin users
  include_tasks: configure_user.yml
  loop: "{{ query('dict', admin_users) }}"
  loop_control:
    label: "{{ user.key }}"
    loop_var: user

- name: cleanup removed users
  include_tasks: cleanup_users.yml

- name: allow our admin users to do passwordless sudo
  lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%wheel'
    line: '%wheel ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'

- name: ensure root login is disabled for SSH
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: "PermitRootLogin no"
    state: present
  register: sshd_config_root_login_changed

- name: ensure password login is disabled for SSH
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: "PasswordAuthentication no"
    state: present
  register: sshd_config_password_auth_changed

- name: reload sshd if needed
  systemd:
    name: sshd.service
    enabled: yes
    state: reloaded
  when: sshd_config_root_login_changed.changed or sshd_config_password_auth_changed.changed
