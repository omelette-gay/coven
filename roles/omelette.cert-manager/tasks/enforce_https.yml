- name: apply Traefik global configuration overrides
  kubernetes.core.k8s:
    name: traefik
    namespace: kube-system
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      spec:
        valuesContent: |-
          ports:
            websecure:
              tls:
                enabled: true
            web:
              redirectTo:
                port: websecure
