---
- name: install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: "{{ lookup('helm_chart', 'cert-manager').repository }}"
    chart_version: "{{ lookup('helm_chart', 'cert-manager').version }}"
    release_namespace: cert-manager
    create_namespace: true
    release_values:
      crds:
        enabled: true
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true
    wait: true
  notify: restart Grafana
