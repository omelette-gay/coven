---
- name: Add jetstack repo
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    release_namespace: cert-manager
    create_namespace: true
    release_values:
      crds:
        enabled: true
      prometheus:
        enabled: true
        podmonitor:
          enabled: true

- name: configure Let's Encrypt for cert-manager
  kubernetes.core.k8s:
    name: "{{ certmanager_acme_issuer }}"
    namespace: cert-manager
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      spec:
        acme:
          email: "{{ certmanager_acme_account_email }}"
          server: "{{ certmanager_acme_server }}"
          privateKeySecretRef:
            name: "{{ certmanager_acme_issuer }}-private-key"
          solvers:
            - http01:
                ingress:
                  class: traefik
