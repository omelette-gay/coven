- name: configure Traefik to redirect all http traffic to https, and configure Let's Encrypt
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    name: traefik
    namespace: kube-system
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      spec:
        valuesContent: |-
          globalArguments:
            - "--certificatesresolvers.{{ certmanager_traefik_certresolver }}.acme.tlschallenge"
            - "--certificatesresolvers.{{ certmanager_traefik_certresolver }}.acme.email={{ certmanager_acme_account_email }}"
            - "--certificatesresolvers.{{ certmanager_traefik_certresolver }}.acme.caserver={{ certmanager_acme_server }}"
            - "--certificatesresolvers.{{ certmanager_traefik_certresolver }}.acme.storage=/data/acme.json"
          
          ports:
            websecure:
              tls:
                enabled: true
            web:
              redirectTo:
                port: websecure
