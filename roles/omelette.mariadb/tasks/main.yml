- name: install mariadb-operator-crds
  kubernetes.core.helm:
    name: mariadb-operator-crds
    chart_ref: mariadb-operator-crds
    chart_repo_url: "{{ lookup('helm_chart', 'mariadb-operator-crds').repository }}"
    chart_version: "{{ lookup('helm_chart', 'mariadb-operator-crds').version }}"
    release_namespace: "{{ mariadb_k8s_namespace }}"
    create_namespace: true
    wait: true

- name: install mariadb-operator
  kubernetes.core.helm:
    name: mariadb-operator
    chart_ref: mariadb-operator
    chart_repo_url: "{{ lookup('helm_chart', 'mariadb-operator').repository }}"
    chart_version: "{{ lookup('helm_chart', 'mariadb-operator').version }}"
    release_namespace: "{{ mariadb_k8s_namespace }}"
    release_values:
      metrics:
        enabled: true
      webhook:
        cert:
          certManager:
            enabled: true
            issuerRef:
              name: vault
              namespace: cert-manager
              kind: ClusterIssuer
    wait: true
