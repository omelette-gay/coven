---
- name: Create k8s service account for reading secrets
  kubernetes.core.k8s:
    name: "{{ vault_k8s_secret.k8s_service_account_name }}"
    namespace: "{{ vault_k8s_secret.k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: ServiceAccount

- name: configure secret reading policy for Vault
  hashivault_policy:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ vault_k8s_secret.vault_role_name }}"
    rules: |-
      path "{{ vault_kv_mountpoint }}/data/{{ vault_k8s_secret.vault_secret_name }}" {
        capabilities = ["read"]
      }

- name: create Vault role for reading secrets
  hashivault_k8s_auth_role:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ vault_k8s_secret.vault_role_name }}"
    policies:
      - "{{ vault_k8s_secret.vault_role_name }}"
    bound_service_account_names:
      - "{{ vault_k8s_secret.k8s_service_account_name }}"
    bound_service_account_namespaces:
      - "{{ vault_k8s_secret.k8s_namespace }}"

- name: create k8s SecretStore for reading Vault secret
  kubernetes.core.k8s:
    name: "vault-{{ vault_k8s_secret.vault_role_name }}"
    namespace: "{{ vault_k8s_secret.k8s_namespace }}"
    definition:
      apiVersion: external-secrets.io/v1
      kind: SecretStore
      spec:
        provider:
          vault:
            server: "http://vault.vault.svc.cluster.local:8200"
            path: "{{ vault_kv_mountpoint }}"
            version: "v2"
            auth:
              kubernetes:
                role: "{{ vault_k8s_secret.vault_role_name }}"
                serviceAccountRef:
                  name: "{{ vault_k8s_secret.k8s_service_account_name }}"

- name: Create k8s secret from Vault
  kubernetes.core.k8s:
    name: "{{ vault_k8s_secret.k8s_secret_name }}"
    namespace: "{{ vault_k8s_secret.k8s_namespace }}"
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      spec:
        refreshInterval: "{{ vault_k8s_secret.k8s_secret_refresh_interval|default('1h') }}"
        secretStoreRef:
          name: "vault-{{ vault_k8s_secret.vault_role_name }}"
          kind: SecretStore
        target:
          name: "{{ vault_k8s_secret.k8s_secret_name }}"
        dataFrom:
          - extract:
              key: "{{ vault_k8s_secret.vault_secret_name }}"
