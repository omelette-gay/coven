- name: Add hashicorp repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com

- name: install Vault
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    release_values:
      global:
        serverTelemetry:
          prometheusOperator: true
      server:
        ingress:
          enabled: true
          hosts:
            - host: "{{ vault_host }}"
          annotations:
            traefik.ingress.kubernetes.io/router.tls: "{{ kubeconfig_require_secure|default(true)|string }}"
            traefik.ingress.kubernetes.io/router.tls.certresolver: "{{ certmanager_traefik_certresolver }}"
        hostAliases: "{{ k8s_hostaliases|default(omit) }}"
      ui:
        enabled: true
      serverTelemetry:
        serviceMonitor:
          enabled: true
        prometheusRules:
          enabled: true
    wait: true
