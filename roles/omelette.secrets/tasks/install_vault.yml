- name: Add hashicorp repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com

- name: Create Vault namespace
  kubernetes.core.k8s:
    name: vault
    api_version: v1
    kind: Namespace

- name: block Vault metrics endpoint from web
  kubernetes.core.k8s:
    name: block-metrics-path
    namespace: vault
    definition:
      apiVersion: traefik.containo.us/v1alpha1
      kind: Middleware
      spec:
        plugin:
          plugin-blockpath:
            Regex:
              - ^/v1/sys/metrics(.*)

- name: install Vault
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    release_values:
      global:
        serverTelemetry:
          prometheusOperator: true
      server:
        ingress:
          enabled: true
          hosts:
            - host: "{{ vault_host }}"
          annotations:
            cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
            traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd,vault-block-metrics-path@kubernetescrd"
          tls:
            - hosts:
                - "{{ vault_host }}"
              secretName: vault-tls
        standalone:
          config: |-
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              
              # Enable unauthenticated metrics access (necessary for Prometheus Operator)
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }
            
            telemetry {
              prometheus_retention_time = "30s",
              disable_hostname = true
            }
  
            storage "file" {
              path = "/vault/data"
            }
        hostAliases: "{{ k8s_hostaliases|default(omit) }}"
      ui:
        enabled: true
      serverTelemetry:
        serviceMonitor:
          enabled: true
        prometheusRules:
          enabled: true
    wait: true
  notify: restart Grafana
