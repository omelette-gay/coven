- name: Add hashicorp repo
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com

- name: install Vault
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    release_namespace: vault
    create_namespace: true
    release_values:
      global:
        serverTelemetry:
          prometheusOperator: true
      server:
        ingress:
          enabled: true
          hosts:
            - host: "{{ vault_host }}"
          annotations:
            cert-manager.io/cluster-issuer: "{{ certmanager_acme_issuer }}"
            traefik.ingress.kubernetes.io/router.middlewares: "{% if kubeconfig_require_secure|default(true) %}kube-system-redirect-https@kubernetescrd{% else %}{{ omit }}{% endif %}"
          tls:
            - hosts:
                - "{{ vault_host }}"
              secretName: vault-tls
        standalone:
          config: |-
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              
              # Enable unauthenticated metrics access (necessary for Prometheus Operator)
              telemetry {
                unauthenticated_metrics_access = "true"
              }
            }
            
            telemetry {
              prometheus_retention_time = "30s",
              disable_hostname = true
            }
  
            storage "file" {
              path = "/vault/data"
            }
        hostAliases: "{{ k8s_hostaliases|default(omit) }}"
      ui:
        enabled: true
      serverTelemetry:
        serviceMonitor:
          enabled: true
        prometheusRules:
          enabled: true
    wait: true
