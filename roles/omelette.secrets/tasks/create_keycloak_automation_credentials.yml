- name: check if secret exists in Vault with automation credentials for Keycloak
  hashivault_read:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ keycloak_vault_secret_path }}"
    version: 2
  ignore_errors: true
  register: keycloak_automation_credentials

- name: create secret in Vault with automation password for Keycloak
  hashivault_secret:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ keycloak_vault_secret_path }}"
    data:
      username: "{{ keycloak_automation_username }}"
      password: "{{ lookup('community.general.random_string', length=30) }}"
  when: keycloak_automation_credentials.failed

- name: ensure user exists in Keycloak with these credentials
  middleware_automation.keycloak.keycloak_user:
    realm: master
    username: "{{ keycloak_automation_username }}"
    credentials:
      - type: password
        value: "{{ lookup('hashivault', keycloak_vault_secret_path, 'password', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) }}"
        temporary: false
    enabled: true

- name: assign automation user admin role
  middleware_automation.keycloak.keycloak_user_rolemapping:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_username: "{{ keycloak_username }}"
    auth_password: "{{ keycloak_password }}"
    auth_realm: master
    validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    realm: master
    target_username: "{{ keycloak_automation_username }}"
    roles:
      - name: admin
