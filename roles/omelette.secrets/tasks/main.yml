- name: install Vault
  include_tasks: install_vault.yml

- name: enable KV secrets engine
  hashivault_secret_engine:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ vault_kv_mountpoint }}"
    backend: kv
    options:
      version: 2

- name: allow k8s service accounts to login to vault
  include_tasks: enable_k8s_service_account_login.yml

- name: configure PKI for cert-manager
  include_tasks: configure_vault_pki.yml

- name: install External Secrets Operator
  include_tasks: install_external_secrets_operator.yml

- name: create k8s secrets from Vault
  include_tasks: create_k8s_secret.yml
  loop: "{{ vault_k8s_secrets }}"
  loop_control:
    label: "{{ vault_k8s_secret.vault_secret_name }} => {{ vault_k8s_secret.k8s_namespace }}/{{ vault_k8s_secret.k8s_secret_name }}"

- name: configure Vault policies
  include_tasks: vault_policies.yml

- name: enable login with Keycloak
  include_tasks: enable_keycloak_login.yml

- name: create credentials for automated management of Keyclock
  include_tasks: create_keycloak_automation_credentials.yml

- name: allow Vault to issue k8s credentials
  include_tasks: enable_k8s_credential_issuing.yml

