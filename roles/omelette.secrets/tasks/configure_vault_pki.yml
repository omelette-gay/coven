- name: enable PKI engine on Vault
  hashivault_secret_engine:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: pki
    backend: pki
    config:
      max_lease_ttl: 87600h

- name: generate CA root
  hashivault_pki_ca:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    common_name: "{{ cluster_domain }}"
    config:
      ttl: 87600h

- name: configure PKI engine
  hashivault_write:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    mount_point: pki
    secret: config/urls
    data:
      issuing_certificates: "http://vault.vault.svc.cluster.local:8200/v1/pki/ca"
      crl_distribution_points: "http://vault.vault.svc.cluster.local:8200/v1/pki/crl"
    update: true

- name: create role for issuing certs in the PKI namespace
  hashivault_pki_role:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ vault_pki_cluster_issuer_name }}"
    config:
      allowed_domains:
        - "{{ cluster_domain }}"
      allow_subdomains: true
      require_cn: false
      max_ttl: 8760h

- name: create policy for issuing certs in the PKI namespace
  hashivault_policy:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "pki-{{ vault_pki_cluster_issuer_name }}-issuer"
    rules: |-
      path "pki*" { capabilities = ["read", "list"] }
      path "pki/sign/{{ vault_pki_cluster_issuer_name }}" { capabilities = ["create", "update"] }
      path "pki/issue/{{ vault_pki_cluster_issuer_name }}" { capabilities = ["create"] }

- name: allow cert-manager to use PKI role
  hashivault_k8s_auth_role:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "cert-manager"
    policies:
      - "pki-{{ vault_pki_cluster_issuer_name }}-issuer"
    bound_service_account_names:
      - vault-issuer
    bound_service_account_namespaces:
      - cert-manager
