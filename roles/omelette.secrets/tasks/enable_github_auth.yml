- name: enable GitHub as auth method for Vault
  hashivault_auth_method:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    method_type: oidc
    mount_point: "{{ vault_github_mountpoint }}"
    config:
      default_lease_ttl: 1h
      max_lease_ttl: 1h

- name: configure GitHub auth method for Vault
  hashivault_oidc_auth_method_config:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    mount_point: "{{ vault_github_mountpoint }}"
    oidc_discovery_url: "https://token.actions.githubusercontent.com"
    bound_issuer: "https://token.actions.githubusercontent.com"

- name: allow the gitops repo to assume an admim
  hashivault_write:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    mount_point: "auth/{{ vault_github_mountpoint }}"
    secret: "role/{{ gitops_vault_role }}"
    data:
      role_type: jwt
      user_claim: actor
      bound_audiences:
        - https://github.com/{{ gitops_repo.split("/")[0] }}
      bound_claims:
        repository:
          - "{{ gitops_repo }}"
      policies:
        - "{{ vault_admin_policy_name }}"
    update: true
