- name: install External Secrets Operator
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets
    chart_repo_url: "{{ lookup('helm_chart', 'external-secrets').repository }}"
    chart_version: "{{ lookup('helm_chart', 'external-secrets').version }}"
    release_namespace: external-secrets
    create_namespace: true
    release_values:
      serviceMonitor:
        enabled: true
      webhook:
        serviceMonitor:
          enabled: true
      certController:
        serviceMonitor:
          enabled: true
    wait: true
  notify: restart Grafana
