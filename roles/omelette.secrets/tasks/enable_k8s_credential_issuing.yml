- name: create k8s role to allow Vault to issue credentials for the k8s cluster
  kubernetes.core.k8s:
    name: allow-vault-credential-issuing
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      rules:
        - apiGroups: [ "" ]
          resources: [ "serviceaccounts", "serviceaccounts/token" ]
          verbs: [ "create", "update", "delete" ]
        - apiGroups: [ "rbac.authorization.k8s.io" ]
          resources: [ "rolebindings", "clusterrolebindings" ]
          verbs: [ "create", "update", "delete" ]
        - apiGroups: [ "rbac.authorization.k8s.io" ]
          resources: [ "roles", "clusterroles" ]
          verbs: [ "bind", "escalate", "create", "update", "delete" ]

- name: allow Vault service account to access this role
  kubernetes.core.k8s:
    name: allow-vault-credential-issuing
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: allow-vault-credential-issuing
      subjects:
        - kind: ServiceAccount
          name: vault
          namespace: vault

- name: enable Kubernetes secret engine for Vault
  hashivault_secret_engine:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: kubernetes
    backend: kubernetes

- name: configure Kubernetes secret engine
  hashivault_write:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    mount_point: kubernetes
    secret: config
    data:
      kubernetes_host: "{{ vault_k8s_controller_url }}"
      kubernetes_ca_cert: "{{ hostvars[groups.all[0]].kubeconfig_ca_data|b64decode }}"

- name: create an admin role in Vault
  hashivault_write:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    mount_point: kubernetes
    secret: roles/admin
    data:
      kubernetes_role_name: admin
      kubernetes_role_type: ClusterRole
      allowed_kubernetes_namespaces: "*"

