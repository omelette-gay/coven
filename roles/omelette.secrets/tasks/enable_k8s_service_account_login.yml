- name: add k8s as auth method for Vault
  hashivault_auth_method:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    method_type: kubernetes

- name: configure vault to trust k8s 
  hashivault_k8s_auth_config:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    kubernetes_host: "https://{{ hostvars[groups.all[0]].ansible_ssh_host }}:6443"
    kubernetes_ca_cert: "{{ hostvars[groups.all[0]].kubeconfig_ca_data|b64decode }}"