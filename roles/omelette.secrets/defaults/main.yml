vault_host: "vault.{{ cluster_domain }}"
vault_url: "https://{{ vault_host }}"
vault_admin_policy_name: admin
vault_keycloak_admin_role: vault-admin
vault_keycloak_client_name: vault
vault_keycloak_auth_admin_role: admin
vault_keycloak_mount_point: keycloak
vault_kv_mountpoint: secret
vault_k8s_controller_url: "https://{{ hostvars[groups.all[0]].ansible_ssh_host }}:6443"
vault_pki_cluster_issuer_name: coven

# secrets to sync from Vault to k8s, format:
# vault_k8s_secrets:
#   - vault_secret_name: myapp
#     k8s_secret_name: myapp-secret
#     k8s_namespace: myapp
#     k8s_service_account_name: secret-reader
#     vault_role_name: myapp
vault_k8s_secrets: []

traefik_blockpath_plugin_verson: v0.2.1
