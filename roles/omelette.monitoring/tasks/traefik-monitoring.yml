- name: configure Traefik for monitoring
  kubernetes.core.k8s:
    name: traefik
    namespace: kube-system
    definition:
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      spec:
        valuesContent: |-
          experimental:
            plugins:
              plugin-blockpath:
                moduleName: github.com/traefik/plugin-blockpath
                version: {{ traefik_blockpath_plugin_verson }}
          
          metrics:
            prometheus:
              enabled: true
              serviceMonitor:
                enabled: true
