- name: install Promtail to send all k8s logs to Loki
  kubernetes.core.helm:
    name: promtail
    chart_ref: promtail
    chart_repo_url: "{{ lookup('helm_chart', 'promtail').repository }}"
    chart_version: "{{ lookup('helm_chart', 'promtail').version }}"
    release_namespace: monitoring
    create_namespace: true
    release_values:
      # enable monitoring of Promtail
      serviceMonitor:
        enabled: true

      # collect systemd from host
      config:
        snippets:
          extraScrapeConfigs: |
            - job_name: systemd-run-log
              journal:
                json: true
                max_age: 12h
                path: /run/log/journal
                labels:
                  job: systemd-journal
              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: 'unit'
            - job_name: systemd-var-log
              journal:
                json: true
                max_age: 12h
                path: /var/log/journal
                labels:
                  job: systemd-journal
              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: 'unit'
      extraVolumes:
        - name: run-log-journal
          hostPath:
            path: /var/log/journal
        - name: var-log-journal
          hostPath:
            path: /var/log/journal
      extraVolumeMounts:
        - name: run-log-journal
          mountPath: /run/log/journal
          readOnly: true
        - name: var-log-journal
          mountPath: /var/log/journal
          readOnly: true
    wait: true
