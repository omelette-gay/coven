- name: Add grafana repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts

- name: install Promtail to send all k8s logs to Loki
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    release_namespace: monitoring
    create_namespace: true
    release_values:
      # enable monitoring of Promtail
      serviceMonitor:
        enabled: true

      # collect systemd from host
      config:
        snippets:
          extraScrapeConfigs: |
            - job_name: systemd
              journal:
                json: true
                max_age: 12h
                path: /run/log/journal
                labels:
                  job: systemd-journal
              relabel_configs:
                - source_labels: ['__journal__systemd_unit']
                  target_label: 'unit'
      extraVolumes:
        - name: journal
          hostPath:
            path: /run/log/journal
      extraVolumeMounts:
        - name: journal
          mountPath: /run/log/journal
          readOnly: true
