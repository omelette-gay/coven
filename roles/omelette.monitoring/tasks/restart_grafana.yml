- name: Create temporary file for kubeconfig
  ansible.builtin.tempfile:
    state: file
  register: kubeconfig_tempfile

- name: write kubeconfig to temporary file
  copy:
    dest: kubeconfig_tempfile.path
    content: "{{ kubeconfig | to_yaml }}"

- name: do rolling restart of Grafana
  shell: /bin/bash -c "kubectl {% if kubeconfig_require_secure|default(true) == false %}--insecure-skip-tls-verify{% endif %} rollout restart deployment kube-prometheus-grafana -n monitoring"
  environment:
    KUBECONFIG: kubeconfig_tempfile.path

- name: Delete temporary kubeconfig file
  file:
    path: kubeconfig_tempfile.path
    state: absent
