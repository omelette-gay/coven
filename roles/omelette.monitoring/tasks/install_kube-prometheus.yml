- name: Set up SSO
  include_tasks: configure_grafana_sso.yml
  when: bootstrap|default(false) == false

- name: install kube-prometheus
  kubernetes.core.helm:
    name: kube-prometheus
    chart_ref: kube-prometheus-stack
    chart_repo_url: "{{ lookup('helm_chart', 'kube-prometheus-stack').repository }}"
    chart_version: "{{ lookup('helm_chart', 'kube-prometheus-stack').version }}"
    release_namespace: monitoring
    create_namespace: true
    release_values:
      crds:
        upgradeJob:
          enabled: true
          forceConflicts: true # required so for fresh installs things can go from Helm managed to managed via the upgrade job

      grafana:
        # configure Grafana
        grafana.ini:
          server:
            domain: "https://{{ grafana_host }}/"
            root_url: "https://{{ grafana_host }}/"
          auth.generic_oauth: "{{ grafana_generic_oauth_config|default(omit) }}"
          security:
            disable_initial_admin_creation: true
            cookie_secure: true
          auth:
            disable_login_form: true   
            oauth_auto_login: false
          smtp:
            enabled: true
            host: "{{ smtp_relay.host }}:{{ smtp_relay.port }}"
            from_address: "grafana@{{ cluster_domain }}"
        envFromSecrets:
          - name: grafana-keycloak-creds
            optional: true

        # auto-discover resources installed into the cluster
        # this has to be done at boot
        sidecar:
          alerts:
            enabled: true
            searchNamespace: ALL
            skipReload: true
            initAlerts: true
            watchMethod: LIST
          dashboards:
            enabled: true
            searchNamespace: ALL
            skipReload: true
            initDashboards: true
            watchMethod: LIST
          datasources:
            enabled: true
            searchNamespace: ALL
            skipReload: true
            initDatasources: true
            watchMethod: LIST
          notifiers:
            enabled: true
            searchNamespace: ALL
            skipReload: true
            initNotifiers: true
            watchMethod: LIST

        # expose Grafana to the web
        ingress:
          enabled: true
          hosts:
            - "{{ grafana_host }}"
          annotations:
            cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
            traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
          tls:
            - hosts:
                - "{{ grafana_host }}"
              secretName: grafana-tls

        hostAliases: "{{ k8s_hostaliases|default(omit) }}"

        # https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/metrics.md#prometheus-reference-installation
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: mariadb
                orgId: 1
                folder: ''
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/mariadb
        dashboards:
          mariadb:
            mysql-overview:
              gnetId: 7362
              revision: 5
              datasource: Prometheus
            mysql-replication:
              gnetId: 7371
              revision: 1
              datasource: Prometheus
            mariadb-galera:
              gnetId: 13106
              revision: 3
              datasource: Prometheus
            mysql-quickstart:
              gnetId: 14057
              revision: 1
              datasource: Prometheus

        persistence:
          enabled: true

      prometheus:
        prometheusSpec:
          # enable the OTLP receiver
          enableOTLPReceiver: true
          otlp:
            # Recommended attributes to be promoted to labels - https://prometheus.io/docs/guides/opentelemetry/
            promoteResourceAttributes:
              - service.instance.id
              - service.name
              - service.namespace
              - service.version
              - container.name
              - k8s.cluster.name
              - k8s.container.name
              - k8s.cronjob.name
              - k8s.daemonset.name
              - k8s.deployment.name
              - k8s.job.name
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.replicaset.name
              - k8s.statefulset.name

          # look for Prometheus monitoring config installed by other Helm charts
          ruleSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          serviceMonitorSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false

          # enable persistence
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 20Gi

      # fix kube-prometheus-stack to work for k3s where everything is exposed together
      # https://github.com/k3s-io/k3s/issues/3619#issuecomment-1991598167
      kubeApiServer:
        serviceMonitor:
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      kubelet:
        serviceMonitor:
          cAdvisorRelabelings:
            - action: replace
              sourceLabels: [ __metrics_path__ ]
              targetLabel: metrics_path
            - action: replace
              targetLabel: instance
              sourceLabels:
                - "node"
          relabelings:
            - action: replace
              sourceLabels: [ __metrics_path__ ]
              targetLabel: metrics_path
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      kubeControllerManager:
        endpoints: "{{ groups['k3s_controllers'] | map('extract', hostvars, ['k3s_agent', 'node-ip']) }}"
        serviceMonitor:
          https: true
          insecureSkipVerify: true
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      # whilst we are single node, there is no etcd, so we skip this part - but it is defined upstream

      kubeScheduler:
        endpoints: "{{ groups['k3s_controllers'] | map('extract', hostvars, ['k3s_agent', 'node-ip']) }}"
        serviceMonitor:
          https: true
          insecureSkipVerify: true
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      kubeProxy:
        endpoints: "{{ groups['k3s_controllers'] | map('extract', hostvars, ['k3s_agent', 'node-ip']) }}"
        service:
          selector:
            k8s-app: kube-proxy
        serviceMonitor:
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      coreDns:
        serviceMonitor:
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      kubeDns:
        serviceMonitor:
          metricRelabelings:
            - action: drop
              regex: (apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|apiserver_request_sli_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: "etcd_request_duration_seconds_bucket"
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (scheduler_plugin_execution_duration_seconds_bucket)
              sourceLabels: [ __name__ ]
            - action: drop
              regex: (workqueue_work_duration_seconds_bucket)
              sourceLabels: [ __name__ ]

      # lock down node exporter from the web
      prometheus-node-exporter:
        kubeRBACProxy:
          enabled: true
        prometheus:
          monitor:
            scheme: https
            bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecureSkipVerify: true

        # collect textfiles from the host
        extraArgs:
          - --collector.textfile.directory=/run/node-exporter
        extraHostVolumeMounts:
          - name: textfiles
            hostPath: /run/node-exporter
            mountPath: /run/node-exporter
            readOnly: true

      alertmanager:
        config:
          global:
            smtp_smarthost: "{{ smtp_relay.host }}:{{ smtp_relay.port }}"
            smtp_from: "alertmanager@{{ cluster_domain }}"
        # stop adding namespace restriction when installing alerting rules
        alertmanagerSpec:
          alertmanagerConfigMatcherStrategy:
            type: None

          # enable persistence
          storage:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 5Gi

      kube-state-metrics:
        enabled: true

        rbac:
          extraRules:
            - apiGroups: [ "k8s.mariadb.com" ]
              resources: [ "physicalbackups" ]
              verbs: [ "list", "watch" ]

        customResourceState:
          enabled: true
          config:
            kind: CustomResourceStateMetricsList
            spec:
              resources:
                - groupVersionKind:
                    group: k8s.mariadb.com
                    version: v1alpha1
                    kind: PhysicalBackup
                  labelsFromPath:
                    name: [ metadata, name ]
                    namespace: [ metadata, namespace ]
                  metrics:
                    - name: mariadb_physicalbackup_status_condition
                      description: "The status of conditions for MariaDB PhysicalBackups resources"
                      each:
                        type: Gauge
                        gauge:
                          path: [ status, conditions ]
                          valueFrom: [ status ]
                          labelsFromPath:
                            condition: [ type ]

                    - name: mariadb_physicalbackup_completion_time_seconds
                      description: "The completion time of the last MariaDB PhysicalBackup"
                      each:
                        type: Gauge
                        gauge:
                          path: [ status, lastScheduleTime ]

        prometheus:
          monitor:
            http:
              metricRelabelings:
                - action: replace
                  sourceLabels: [ __name__ ]
                  regex: 'kube_customresource_(mariadb_physicalbackup_.+)'
                  targetLabel: __name__
                  replacement: '${1}'

      additionalPrometheusRulesMap:
        needs-restarting:
          groups:
            - name: needs-restarting
              rules:
                - alert: NodeNeedsRestarting
                  expr: node_reboot_required == 1
                  for: 1h
                  annotations:
                    summary: Host OS indicates that node requires restart
                    description: The host OS is indicating that the node requires a restart as currently running components have been updated but the currently running version is not the latest.
                  labels:
                    severity: warning

        vault:
          groups:
            - name: vault
              rules:
                - alert: VaultIsSealed
                  expr: vault_core_unsealed != 1 or absent(vault_core_unsealed) == 1
                  for: 1m
                  annotations:
                    summary: Vault is not unsealed
                    description: Vault is not reporting that it is unsealed. It may need unsealing or there is another issue affecting Vault.
                  labels:
                    severity: critical

        http-probes:
          groups:
            - name: http-probes
              rules:
                - alert: HttpProbeFailed
                  expr: probe_success == 0
                  for: 2m
                  annotations:
                    summary: HTTP probe failed
                    description: Endpoint {{ "{{" }} $labels.instance {{ "}}" }} down
                  labels:
                    severity: error

        external-secrets:
          groups:
            - name: external-secrets
              rules:
                - alert: ExternalSecretSyncError
                  annotations:
                    description: |-
                      The external secret {{ "{{" }} $labels.exported_namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} failed to sync.
                      Use this command to check the status:
                      kubectl get externalsecret {{ "{{" }} $labels.name {{ "}}" }} -n {{ "{{" }} $labels.exported_namespace {{ "}}" }}
                    summary: External secret failed to sync
                  labels:
                    severity: warning
                  expr: externalsecret_status_condition{status="False", condition!="Deleted"} == 1
                  for: 5m

        # https://monitoring.mixins.dev/cert-manager/
        cert-manager:
          groups:
            - name: cert-manager
              rules:
                - alert: CertManagerAbsent
                  annotations:
                    description: New certificates will not be able to be minted, and existing ones
                      can't be renewed until cert-manager is back.
                    runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerabsent
                    summary: Cert Manager has disappeared from Prometheus service discovery.
                  expr: absent(up{job="cert-manager"})
                  for: 10m
                  labels:
                    severity: critical
            - name: certificates
              rules:
                - alert: CertManagerCertExpirySoon
                  annotations:
                    description: The domain that this cert covers will be unavailable after {{ "{{" }} $value
                      | humanizeDuration {{ "}}" }}. Clients using endpoints that this cert protects will
                      start to fail in {{ "{{" }} $value | humanizeDuration {{ "}}" }}.
                    runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagercertexpirysoon
                    summary: The cert `{{ "{{" }} $labels.name }}` is {{ "{{" }} $value | humanizeDuration {{ "}}" }} from
                      expiry, it should have renewed over a week ago.
                  expr: |
                    avg by (exported_namespace, namespace, name) (
                      certmanager_certificate_expiration_timestamp_seconds - time()
                    ) < (21 * 24 * 3600) # 21 days in seconds
                  for: 1h
                  labels:
                    severity: warning
                - alert: CertManagerCertNotReady
                  annotations:
                    description: This certificate has not been ready to serve traffic for at least
                      10m. If the cert is being renewed or there is another valid cert, the ingress
                      controller _may_ be able to serve that instead.
                    runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagercertnotready
                    summary: The cert `{{ "{{" }} $labels.name }}` is not ready to serve traffic.
                  expr: |
                    max by (name, exported_namespace, namespace, condition) (
                      certmanager_certificate_ready_status{condition!="True"} == 1
                    )
                  for: 10m
                  labels:
                    severity: critical
                - alert: CertManagerHittingRateLimits
                  annotations:
                    description: Depending on the rate limit, cert-manager may be unable to generate
                      certificates for up to a week.
                    runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerhittingratelimits
                    summary: Cert manager hitting LetsEncrypt rate limits.
                  expr: |
                    sum by (host) (
                      rate(certmanager_http_acme_client_request_count{status="429"}[5m])
                    ) > 0
                  for: 5m
                  labels:
                    severity: critical

        # https://monitoring.mixins.dev/postgres-exporter/
        postgres-exporter:
          groups:
            - name: PostgreSQL
              rules:
                - alert: PostgreSQLMaxConnectionsReached
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} is exceeding the currently configured maximum
                  Postgres connection limit (current value: {{ "{{" }} $value {{ "}}" }}s). Services may be
                  degraded - please take immediate action (you probably need to increase max_connections
                  in the Docker image and re-deploy).'
                    summary: Postgres connections count is over the maximum amount.
                  expr: |
                    sum by (job, instance, server) (pg_stat_activity_count{})
                    >=
                    sum by (job, instance, server) (pg_settings_max_connections{})
                    -
                    sum by (job, instance, server) (pg_settings_superuser_reserved_connections{})
                  for: 1m
                  labels:
                    severity: warning
                - alert: PostgreSQLHighConnections
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} is exceeding 80% of the currently configured
                  maximum Postgres connection limit (current value: {{ "{{" }} $value {{ "}}" }}s). Please check
                  utilization graphs and confirm if this is normal service growth, abuse or
                  an otherwise temporary condition or if new resources need to be provisioned
                  (or the limits increased, which is mostly likely).'
                    summary: Postgres connections count is over 80% of maximum amount.
                  expr: |
                    sum by (job, instance, server) (pg_stat_activity_count{})
                    >
                    (
                      sum by (job, instance, server) (pg_settings_max_connections{})
                      -
                      sum by (job, instance, server) (pg_settings_superuser_reserved_connections{})
                    ) * 0.8
                  for: 10m
                  labels:
                    severity: warning
                - alert: PostgreSQLDown
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} is rejecting query requests from the exporter,
                  and thus probably not allowing DNS requests to work either. User services
                  should not be effected provided at least 1 node is still alive.'
                    summary: PostgreSQL is not processing queries.
                  expr: pg_up{} != 1
                  for: 1m
                  labels:
                    severity: warning
                - alert: PostgreSQLSlowQueries
                  annotations:
                    description: 'PostgreSQL high number of slow queries {{ "{{" }} $labels.cluster {{ "}}" }} for
                  database {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }} '
                    summary: PostgreSQL high number of slow queries.
                  expr: |
                    avg by (datname, job, instance, server) (
                      rate (
                        pg_stat_activity_max_tx_duration{datname!~"template.*", }[2m]
                      )
                    ) > 2 * 60
                  for: 2m
                  labels:
                    severity: warning
                - alert: PostgreSQLQPS
                  annotations:
                    description: PostgreSQL high number of queries per second on {{ "{{" }} $labels.cluster
                      {{ "}}" }} for database {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }}
                    summary: PostgreSQL high number of queries per second.
                  expr: |
                    avg by (datname, job, instance, server) (
                      irate(
                        pg_stat_database_xact_commit{datname!~"template.*", }[5m]
                      )
                      +
                      irate(
                        pg_stat_database_xact_rollback{datname!~"template.*", }[5m]
                      )
                    ) > 10000
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgreSQLCacheHitRatio
                  annotations:
                    description: PostgreSQL low on cache hit rate on {{ "{{" }} $labels.cluster {{ "}}" }} for database
                      {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }}
                    summary: PostgreSQL low cache hit rate.
                  expr: |
                    avg by (datname, job, instance, server) (
                      rate(pg_stat_database_blks_hit{datname!~"template.*", }[5m])
                      /
                      (
                        rate(
                          pg_stat_database_blks_hit{datname!~"template.*", }[5m]
                        )
                        +
                        rate(
                          pg_stat_database_blks_read{datname!~"template.*", }[5m]
                        )
                      )
                    ) < 0.98
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgresHasTooManyRollbacks
                  annotations:
                    description: PostgreSQL has too many rollbacks on {{ "{{" }} $labels.cluster {{ "}}" }} for
                      database {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }}
                    summary: PostgreSQL has too many rollbacks.
                  expr: |
                    avg without(pod, instance)
                    (rate(pg_stat_database_xact_rollback{datname!~"template.*"}[5m]) /
                    (rate(pg_stat_database_xact_commit{datname!~"template.*"}[5m]) + rate(pg_stat_database_xact_rollback{datname!~"template.*"}[5m]))) > 0.10
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgresHasHighDeadLocks
                  annotations:
                    description: PostgreSQL has too high deadlocks on {{ "{{" }} $labels.cluster {{ "}}" }} for
                      database {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }}
                    summary: PostgreSQL has high number of deadlocks.
                  expr: |
                    max without(pod, instance) (rate(pg_stat_database_deadlocks{datname!~"template.*"}[5m]) * 60) > 5
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgresAcquiredTooManyLocks
                  annotations:
                    description: PostgreSQL has acquired too many locks on {{ "{{" }} $labels.cluster {{ "}}" }}
                      for database {{ "{{" }} $labels.datname {{ "}}" }} with a value of {{ "{{" }} $value {{ "}}" }}
                    summary: PostgreSQL has high number of acquired locks.
                  expr: "max by(datname, job,instance,server) (\n  (pg_locks_count{datname!~\"template.*\"})
                \n  /\n  on(job,instance) group_left(server) (\n    pg_settings_max_locks_per_transaction{}
                * pg_settings_max_connections{}\n  )\n) > 0.20\n"
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgresReplicationLaggingMore1Hour
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} replication lag exceeds 1 hour. Check for
                  network issues or load imbalances.'
                    summary: PostgreSQL replication lagging more than 1 hour.
                  expr: |
                    (pg_replication_lag{} > 3600) and on (job, instance, server) (pg_replication_is_replica{} == 1)
                  for: 5m
                  labels:
                    severity: warning
                - alert: PostgresHasReplicationSlotUsed
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} has replication slots that are not used,
                  which might lead to replication lag or data inconsistency.'
                    summary: PostgreSQL has unused replication slots.
                  expr: pg_replication_slots_active{} == 0
                  for: 30m
                  labels:
                    severity: critical
                - alert: PostgresReplicationRoleChanged
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} replication role has changed. Verify if
                  this is expected or if it indicates a failover.'
                    summary: PostgreSQL replication role change detected.
                  expr: pg_replication_is_replica{} and changes(pg_replication_is_replica{}[1m])
                    > 0
                  labels:
                    severity: warning
                - alert: PostgresHasExporterErrors
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} exporter is experiencing errors. Verify
                  exporter health and configuration.'
                    summary: PostgreSQL exporter errors detected.
                  expr: pg_exporter_last_scrape_error{} > 0
                  for: 30m
                  labels:
                    severity: critical
                - alert: PostgresTablesNotVaccumed
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} tables have not been vacuumed recently
                  within the last hour, which may lead to performance degradation.'
                    summary: PostgreSQL tables not vacuumed.
                  expr: |
                    group without(pod, instance)(
                      timestamp(
                        pg_stat_user_tables_n_dead_tup{} >
                          pg_stat_user_tables_n_live_tup{}
                            * on(job, instance, server) group_left pg_settings_autovacuum_vacuum_scale_factor{}
                            + on(job, instance, server) group_left pg_settings_autovacuum_vacuum_threshold{}
                      )
                      < time() - 36000
                    )
                  for: 30m
                  labels:
                    severity: critical
                - alert: PostgresTooManyCheckpointsRequested
                  annotations:
                    description: '{{ "{{" }} $labels.instance {{ "}}" }} is requesting too many checkpoints, which
                  may lead to performance degradation.'
                    summary: PostgreSQL too many checkpoints requested.
                  expr: |
                    rate(pg_stat_bgwriter_checkpoints_timed_total{}[5m]) /
                    (rate(pg_stat_bgwriter_checkpoints_timed_total{}[5m]) + rate(pg_stat_bgwriter_checkpoints_req_total{}[5m]))
                    < 0.5
                  for: 5m
                  labels:
                    severity: warning

        # https://github.com/cloudnative-pg/cloudnative-pg/blob/main/docs/src/samples/monitoring/prometheusrule.yaml
        cnpg-default-alerts:
          groups:
            - name: cnp-default.rules
              rules:
                - alert: LongRunningTransaction
                  annotations:
                    description: Pod {{ "{{" }} $labels.pod {{ "}}" }} is taking more than 5 minutes (300 seconds) for a query.
                    summary: A query is taking longer than 5 minutes.
                  expr: |-
                    cnpg_backends_max_tx_duration_seconds > 300
                  for: 1m
                  labels:
                    severity: warning
                - alert: BackendsWaiting
                  annotations:
                    description: Pod {{ "{{" }} $labels.pod  {{ "}}" }} has been waiting for longer than 5 minutes
                    summary: If a backend is waiting for longer than 5 minutes
                  expr: |-
                    cnpg_backends_waiting_total > 300
                  for: 1m
                  labels:
                    severity: warning
                - alert: PGDatabaseXidAge
                  annotations:
                    description: Over 300,000,000 transactions from frozen xid on pod {{ "{{" }} $labels.pod  {{ "}}" }}
                    summary: Number of transactions from the frozen XID to the current one
                  expr: |-
                    cnpg_pg_database_xid_age > 300000000
                  for: 1m
                  labels:
                    severity: warning
                - alert: PGReplication
                  annotations:
                    description: Standby is lagging behind by over 300 seconds (5 minutes)
                    summary: The standby is lagging behind the primary
                  expr: |-
                    cnpg_pg_replication_lag > 300
                  for: 1m
                  labels:
                    severity: warning
                - alert: LastFailedArchiveTime
                  annotations:
                    description: Archiving failed for {{ "{{" }} $labels.pod {{ "}}" }}
                    summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
                  expr: |-
                    (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
                  for: 1m
                  labels:
                    severity: warning
                - alert: DatabaseDeadlockConflicts
                  annotations:
                    description: There are over 10 deadlock conflicts in {{ "{{" }} $labels.pod {{ "}}" }}
                    summary: Checks the number of database conflicts
                  expr: |-
                    cnpg_pg_stat_database_deadlocks > 10
                  for: 1m
                  labels:
                    severity: warning
                - alert: ReplicaFailingReplication
                  annotations:
                    description: Replica {{ "{{" }} $labels.pod {{ "}}" }} is failing to replicate
                    summary: Checks if the replica is failing to replicate
                  expr: |-
                    cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
                  for: 1m
                  labels:
                    severity: warning

        # https://monitoring.mixins.dev/traefik/
        traefik:
          groups:
            - name: traefik
              rules:
                - alert: TraefikConfigReloadFailuresIncreasing
                  annotations:
                    description: |
                      Traefik is failing to reload its config in {{ "{{" }} $labels.job {{ "}}" }}.
                    summary: Traefik is failing to reload its configuration.
                  expr: |
                    sum by (job) (rate(traefik_config_reloads_failure_total{}[5m])) > 0
                  for: 5m
                  labels:
                    severity: critical
                - alert: TraefikTLSCertificatesExpiring
                  annotations:
                    description: |
                      The minimum number of days until a Traefik-served certificate expires is {{ "{{" }} printf "%.0f" $value {{ "}}" }} days on {{ "{{" }} $labels.sans {{ "}}" }} which is below the critical threshold of 7.
                    summary: A Traefik-served TLS certificate will expire very soon.
                  expr: |
                    max by (instance, sans) ((last_over_time(traefik_tls_certs_not_after{}[5m]) - time()) / 86400) < 7
                  for: 5m
                  labels:
                    severity: critical
                - alert: TraefikTLSCertificatesExpiringSoon
                  annotations:
                    description: |
                      The minimum number of days until a Traefik-served certificate expires is {{ "{{" }} printf "%.0f" $value {{ "}}" }} days on {{ "{{" }} $labels.sans {{ "}}" }} which is less than 14 but greater than 7.
                    summary: A Traefik-served TLS certificate will expire soon.
                  expr: |
                    max by (instance, sans) ((last_over_time(traefik_tls_certs_not_after{}[5m]) - time()) / 86400) < 14 > 7
                  for: 5m
                  labels:
                    severity: warning

        external-dns:
          groups:
            - name: external-dns
              rules:
                - alert: ExternalDnsErrors
                  annotations:
                    description: |
                      External DNS ({{ "{{" }} $labels.service {{ "}}" }}) is unable to manage DNS records for services in the cluster.
                    summary: External DNS is reporting errors
                  expr: |
                    sum by (service) (
                      rate(external_dns_registry_errors_total{}[5m]) + rate(external_dns_source_errors_total{}[5m]) 
                      + rate(external_dns_webhook_provider_adjustendpoints_errors_total{}[5m]) 
                      + rate(external_dns_webhook_provider_applychanges_errors_total{}[5m]) 
                      + rate(external_dns_webhook_provider_records_errors_total{}[5m])
                    ) > 0
                  for: 10m
                  labels:
                    severity: critical

        helm:
          groups:
            - name: helm
              rules:
                - alert: HelmDeployFailed
                  annotations:
                    description: |
                      The Helm release {{ "{{" }} $labels.release {{ "}}" }} (namespace: {{ "{{" }} $labels.namespace {{ "}}" }}) is in the failed state.
                    summary: A Helm release is in the failed state
                  expr: helm_chart_info < 0
                  for: 1m
                  labels:
                    severity: critical
                - alert: HelmDeployStuck
                  annotations:
                    description: |
                      The Helm release {{ "{{" }} $labels.release {{ "}}" }} (namespace: {{ "{{" }} $labels.namespace {{ "}}" }}) has been stuck in a pending state for over 15 minutes.
                    summary: A Helm release is stuck in a pending state
                  expr: helm_chart_info > 4
                  for: 15m
                  labels:
                    severity: error
                - alert: HelmDeployUnknown
                  annotations:
                    description: |
                      The Helm release {{ "{{" }} $labels.release {{ "}}" }} (namespace: {{ "{{" }} $labels.namespace {{ "}}" }}) is in an unknown state.
                    summary: A Helm release is stuck in an unknown state
                  expr: helm_chart_info == 0
                  for: 15m
                  labels:
                    severity: warning

        # https://longhorn.io/docs/1.9.1/monitoring/alert-rules-example/
        longhorn:
          groups:
            - name: longhorn.rules
              rules:
                - alert: LonghornVolumeStatusCritical
                  annotations:
                    description: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} on {{ "{{" }}$labels.node{{ "}}" }} is Fault for
                      more than 2 minutes.
                    summary: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} is Fault
                  expr: longhorn_volume_robustness{state="faulted"} == 1
                  for: 5m
                  labels:
                    issue: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} is Fault.
                    severity: critical
                - alert: LonghornVolumeStatusWarning
                  annotations:
                    description: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} on {{ "{{" }}$labels.node{{ "}}" }} is Degraded for
                      more than 5 minutes.
                    summary: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} is Degraded
                  expr: longhorn_volume_robustness{state="degraded"} == 1
                  for: 5m
                  labels:
                    issue: Longhorn volume {{ "{{" }}$labels.volume{{ "}}" }} is Degraded.
                    severity: warning
                - alert: LonghornNodeStorageWarning
                  annotations:
                    description: The used storage of node {{ "{{" }}$labels.node{{ "}}" }} is at {{ "{{" }}$value{{ "}}" }}% capacity for
                      more than 5 minutes.
                    summary:  The used storage of node is over 70% of the capacity.
                  expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 70
                  for: 5m
                  labels:
                    issue: The used storage of node {{ "{{" }}$labels.node{{ "}}" }} is high.
                    severity: warning
                - alert: LonghornDiskStorageWarning
                  annotations:
                    description: The used storage of disk {{ "{{" }}$labels.disk{{ "}}" }} on node {{ "{{" }}$labels.node{{ "}}" }} is at {{ "{{" }}$value{{ "}}" }}% capacity for
                      more than 5 minutes.
                    summary:  The used storage of disk is over 70% of the capacity.
                  expr: (longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes) * 100 > 70
                  for: 5m
                  labels:
                    issue: The used storage of disk {{ "{{" }}$labels.disk{{ "}}" }} on node {{ "{{" }}$labels.node{{ "}}" }} is high.
                    severity: warning
                - alert: LonghornNodeDown
                  annotations:
                    description: There are {{ "{{" }}$value{{ "}}" }} Longhorn nodes which have been offline for more than 5 minutes.
                    summary: Longhorn nodes is offline
                  expr: (avg(longhorn_node_count_total) or on() vector(0)) - (count(longhorn_node_status{condition="ready"} == 1) or on() vector(0)) > 0
                  for: 5m
                  labels:
                    issue: There are {{ "{{" }}$value{{ "}}" }} Longhorn nodes are offline
                    severity: critical
                - alert: LonghornInstanceManagerCPUUsageWarning
                  annotations:
                    description: Longhorn instance manager {{ "{{" }}$labels.instance_manager{{ "}}" }} on {{ "{{" }}$labels.node{{ "}}" }} has CPU Usage / CPU request is {{ "{{" }}$value{{ "}}" }}% for
                      more than 5 minutes.
                    summary: Longhorn instance manager {{ "{{" }}$labels.instance_manager{{ "}}" }} on {{ "{{" }}$labels.node{{ "}}" }} has CPU Usage / CPU request is over 300%.
                  expr: (longhorn_instance_manager_cpu_usage_millicpu/longhorn_instance_manager_cpu_requests_millicpu) * 100 > 300
                  for: 5m
                  labels:
                    issue: Longhorn instance manager {{ "{{" }}$labels.instance_manager{{ "}}" }} on {{ "{{" }}$labels.node{{ "}}" }} consumes 3 times the CPU request.
                    severity: warning
                - alert: LonghornNodeCPUUsageWarning
                  annotations:
                    description: Longhorn node {{ "{{" }}$labels.node{{ "}}" }} has CPU Usage / CPU capacity is {{ "{{" }}$value{{ "}}" }}% for
                      more than 5 minutes.
                    summary: Longhorn node {{ "{{" }}$labels.node{{ "}}" }} experiences high CPU pressure for more than 5m.
                  expr: (longhorn_node_cpu_usage_millicpu / longhorn_node_cpu_capacity_millicpu) * 100 > 90
                  for: 5m
                  labels:
                    issue: Longhorn node {{ "{{" }}$labels.node{{ "}}" }} experiences high CPU pressure.
                    severity: warning
            - name: backups
              rules:
                - alert: LonghornNoRecentBackups
                  annotations:
                    description: k8s volume {{ "{{" }}$labels.pvc{{ "}}" }} in namespace {{ "{{" }}$labels.pvc_namespace{{ "}}" }} last had a successful backup {{ "{{" }}$value | humanizeDuration {{ "}}" }} ago (it should be backed up twice daily).
                    summary: k8s volume {{ "{{" }}$labels.pvc{{ "}}" }} in namespace {{ "{{" }}$labels.pvc_namespace{{ "}}" }} has not had a backup for greater than 24 hours.
                  expr: (time() - longhorn_volume_last_backup_at) > 86400 and (longhorn_volume_last_backup_at > 0)
                  for: 5m
                  labels:
                    severity: error

        # https://monitoring.mixins.dev/mysql/
        mariadb:
          groups:
            - name: MySQLdAlerts
              rules:
                - alert: MySQLDown
                  annotations:
                    description: MySQL {{ '{{' }}$labels.job{{ '}}' }} on {{ '{{' }}$labels.instance{{ '}}' }} is not up.
                    summary: MySQL not up.
                  expr: mysql_up != 1
                  for: 5m
                  labels:
                    severity: critical
            - name: GaleraAlerts
              rules:
                - alert: MySQLGaleraNotReady
                  annotations:
                    description: "{{ '{{' }}$labels.job{{ '}}' }} on {{ '{{' }}$labels.instance{{ '}}' }} is not ready."
                    summary: Galera cluster node not ready.
                  expr: mysql_global_status_wsrep_ready != 1
                  for: 5m
                  labels:
                    severity: warning
                - alert: MySQLGaleraOutOfSync
                  annotations:
                    description: "{{ '{{' }}$labels.job{{ '}}' }} on {{ '{{' }}$labels.instance{{ '}}' }} is not in sync ({{ '{{' }}$value{{ '}}' }} != 4)."
                    summary: Galera cluster node out of sync.
                  expr: (mysql_global_status_wsrep_local_state != 4 and mysql_global_variables_wsrep_desync == 0)
                  for: 5m
                  labels:
                    severity: warning
                - alert: MySQLGaleraDonorFallingBehind
                  annotations:
                    description: "{{ '{{' }}$labels.job{{ '}}' }} on {{ '{{' }}$labels.instance{{ '}}' }} is a donor (hotbackup) and is falling behind (queue size {{ '{{' }}$value{{ '}}' }})."
                    summary: XtraDB cluster donor node falling behind.
                  expr: (mysql_global_status_wsrep_local_state == 2 and mysql_global_status_wsrep_local_recv_queue > 100)
                  for: 5m
                  labels:
                    severity: warning
                - alert: MySQLReplicationNotRunning
                  annotations:
                    description: Replication on {{ '{{' }}$labels.instance{{ '}}' }} (IO or SQL) has been down for more than 2 minutes.
                    summary: Replication is not running.
                  expr: mysql_slave_status_slave_io_running == 0 or mysql_slave_status_slave_sql_running == 0
                  for: 2m
                  labels:
                    severity: critical
                - alert: MySQLReplicationLag
                  annotations:
                    description: Replication on {{ '{{' }}$labels.instance{{ '}}' }} has fallen behind and is not recovering.
                    summary: MySQL slave replication is lagging.
                  expr: (instance:mysql_slave_lag_seconds > 30) and on(instance) (predict_linear(instance:mysql_slave_lag_seconds[5m], 60 * 2) > 0)
                  for: 1m
                  labels:
                    severity: critical
                - alert: MySQLHeartbeatLag
                  annotations:
                    description: The heartbeat is lagging on {{ '{{' }}$labels.instance{{ '}}' }} and is not recovering.
                    summary: MySQL heartbeat is lagging.
                  expr: (instance:mysql_heartbeat_lag_seconds > 30) and on(instance) (predict_linear(instance:mysql_heartbeat_lag_seconds[5m], 60 * 2) > 0)
                  for: 1m
                  labels:
                    severity: critical
                - alert: MySQLInnoDBLogWaits
                  annotations:
                    description: The innodb logs are waiting for disk at a rate of {{ '{{' }}$value{{ '}}' }} / second
                    summary: MySQL innodb log writes stalling.
                  expr: rate(mysql_global_status_innodb_log_waits[15m]) > 10
                  labels:
                    severity: warning

    wait: true
  notify: restart Grafana

- name: install blackbox-exporter for HTTP monitoring
  kubernetes.core.helm:
    name: blackbox-exporter
    chart_ref: prometheus-blackbox-exporter
    chart_repo_url: "{{ lookup('helm_chart', 'prometheus-blackbox-exporter').repository }}"
    chart_version: "{{ lookup('helm_chart', 'prometheus-blackbox-exporter').version }}"
    release_namespace: monitoring
    release_values:
      serviceMonitor:
        enabled: true
        selfMonitor:
          enabled: true
    wait: true

- name: install helm-exporter for deployment monitoring
  kubernetes.core.helm:
    name: helm-exporter
    chart_ref: helm-exporter
    chart_repo_url: "{{ lookup('helm_chart', 'helm-exporter').repository }}"
    chart_version: "{{ lookup('helm_chart', 'helm-exporter').version }}"
    release_namespace: monitoring
    release_values:
      serviceMonitor:
        create: true
      grafanaDashboard:
        enabled: true
    wait: true

- name: monitor Grafana
  kubernetes.core.k8s:
    name: grafana-https
    namespace: monitoring
    api_version: monitoring.coreos.com/v1
    kind: Probe
    definition:
      spec:
        interval: 60s
        module: http_2xx
        prober:
          url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
          path: /probe
        targets:
          staticConfig:
            static:
              - "https://{{ grafana_host }}/login"
