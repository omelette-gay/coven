- name: configure Discord notifier for Grafana
  kubernetes.core.k8s:
    name: "grafana-discord-notifier"
    namespace: monitoring
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        labels:
          grafana_alert: "1"
      stringData:
        discord-notifier.yaml: |-
          apiVersion: 1
          contactPoints:
            - name: Discord
              receivers:
                - uid: discord
                  type: discord
                  settings:
                    avatar_url: https://{{ grafana_host }}/public/img/grafana_icon.svg
                    url: {{ grafana_discord_webhook_url }}
                    use_discord_username: true
                  disableResolveMessage: false
  notify: restart Grafana

- name: create Discord webhook URL secret
  kubernetes.core.k8s:
    name: discord-alerting-webhook
    namespace: monitoring
    definition:
      apiVersion: v1
      kind: Secret
      data:
        webhook_url: "{{ grafana_discord_webhook_url|b64encode }}"
  notify: restart Grafana

- name: configure Discord notifier for Alertmanager
  kubernetes.core.k8s:
    name: "alertmanager-discord-notifier"
    namespace: monitoring
    definition:
      apiVersion: monitoring.coreos.com/v1alpha1
      kind: AlertmanagerConfig
      spec:
        route:
          groupBy: ['namespace', 'alertname']
          receiver: discord-receiver
          repeatInterval: 7d
        receivers:
          - name: discord-receiver
            discordConfigs:
              - apiURL:
                  name: discord-alerting-webhook
                  key: webhook_url
