- name: install kube-prometheus
  include_tasks: install_kube-prometheus.yml

- name: configure Discord alerting for Grafana
  include_tasks: configure_grafana_discord_alerts.yml
  when: grafana_discord_webhook_url is defined

- name: override k3s configuration to expose Prometheus metrics for Traefik
  include_tasks: traefik_monitoring.yml

- name: install loki
  include_tasks: loki.yml
  when: bootstrap|default(false) == false # we can only do this once we've at least bootstrapped our secrets system

- name: install promtail
  include_tasks: promtail.yml
