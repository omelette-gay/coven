---
- name: Get a list of all users
  getent:
    database: passwd
  register: all_users

- name: Remove users not in the allowed list
  user:
    name: "{{ item }}"
    state: absent
  loop: >-
    {{ 
      all_users.ansible_facts.getent_passwd |
      dict2items |
      json_query('[?to_number(value[1]) >= `1000`]') |
      rejectattr('key', '==', "nobody") |
      rejectattr('key', 'in', ssh_users.keys() | list) |
      map(attribute='key') |
      list
    }}
