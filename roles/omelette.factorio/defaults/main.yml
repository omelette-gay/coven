factorio_servers: []
factorio_k8s_service_account: "secret-reader"
factorio_default_config:
  hostNetworkEnabled: false
  image:
    tag: 2.0.73
  service:
    type: LoadBalancer
    ipFamilyPolicy: PreferDualStack
    annotations:
      external-dns.alpha.kubernetes.io/hostname: "{% if factorio_server.dns is defined %}factorio-svc.{{ factorio_server.dns.hostname }}{% else %}{{ omit }}{% endif %}"
  server_settings:
    visibility:
      lan: false
    non_blocking_saving: true
  rcon:
    external: false
