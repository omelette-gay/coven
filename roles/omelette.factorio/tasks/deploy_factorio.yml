---
- name: install factorio-server-charts
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    validate_certs: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ item.server_id }}"
    chart_ref: factorio/factorio-server-charts
    release_namespace: "factorio-{{ item.server_id }}"
    create_namespace: true
    release_values: "{{ item.config }}"
