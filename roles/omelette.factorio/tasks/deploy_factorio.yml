---
# this must be done first because it creates the namesapces - it'll crash because the secrets don't exist
# so we don't initially wait for it
- name: install factorio-server-charts
  kubernetes.core.helm:
    name: "{{ item.server_id }}"
    chart_ref: factorio/factorio-server-charts
    release_namespace: "factorio-{{ item.server_id }}"
    create_namespace: true
    release_values: "{{ item.config }}"

- name: create secret from Vault for game password
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "factorio/{{ item.server_id }}"
      k8s_secret_name: "{{ item.config.serverPassword.passwordSecret }}"
      k8s_namespace: "factorio-{{ item.server_id }}"
      k8s_service_account_name: "{{ factorio_k8s_service_account }}"
      vault_role_name: "factorio-{{ item.server_id }}"
  when: item.config.serverPassword.passwordSecret is defined
