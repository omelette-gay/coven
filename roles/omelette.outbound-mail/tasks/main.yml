- name: create namespace for mail sending
  kubernetes.core.k8s:
    name: "{{ outbound_mail_k8s_namespace }}"
    kind: Namespace
    api_version: v1

- name: check if secret exists in Vault with DKIM keys
  hashivault_read:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ outbound_mail_dkim_secret_name }}"
    version: 2
  ignore_errors: true
  register: outbound_mail_dkim_secret_exists

- name: generate DKIM private key
  community.crypto.openssl_privatekey_pipe:
    size: "{{ outbound_mail_dkim_key_size }}"
    type: "{{ outbound_mail_dkim_key_type }}"
    format: pkcs8
  register: new_outbound_mail_dkim_private_key
  when: outbound_mail_dkim_secret_exists.failed

- name: create secret in Vault with DKIM keys
  hashivault_secret:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ outbound_mail_dkim_secret_name }}"
    # this is horrid and I'm sorry - but there's no native Ansible support for generating DKIM keys in the right format so this is getting done manually
    data: "{{ 
        {} 
        | combine({cluster_domain + '.private': new_outbound_mail_dkim_private_key.privatekey})
        | combine({cluster_domain + '.txt': 'mail._domainkey\tIN\tTXT\t( \"v=DKIM1; k=rsa; p=' + '\" \"'.join((new_outbound_mail_dkim_private_key.privatekey | community.crypto.openssl_privatekey_info).public_key.strip().removeprefix('-----BEGIN PUBLIC KEY-----').removesuffix('-----END PUBLIC KEY-----').strip().split('\n')) + '\" ) ; ----- DKIM key mail for ' + cluster_domain})
      }}"
  when: new_outbound_mail_dkim_private_key is not skipped

- name: sync DKIM keys into secret for postfix to mount
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "{{ outbound_mail_dkim_secret_name }}"
      k8s_secret_name: "{{ outbound_mail_dkim_k8s_secret }}"
      k8s_namespace: "{{ outbound_mail_k8s_namespace }}"
      k8s_service_account_name: outbound-mail-dkim
      vault_role_name: outbound-mail-dkim

- name: publish DKIM records
  hetzner.hcloud.zone_rrset:
    api_token: "{{ lookup('hashivault', external_dns_hetzner_vault_secret_name, 'api_token', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) }}"
    zone: "{{ cluster_dns_zone }}"
    name: "mail._domainkey.{{ cluster_domain.removesuffix(cluster_dns_zone).removesuffix('.') }}"
    type: TXT
    records:
      - value: "{{ ('v=DKIM1; k=rsa; p=' + (lookup('hashivault', outbound_mail_dkim_secret_name, cluster_domain + '.private', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) | community.crypto.openssl_privatekey_info).public_key.replace('\n', '').removeprefix('-----BEGIN PUBLIC KEY-----').removesuffix('-----END PUBLIC KEY-----')) | hetzner.hcloud.txt_record }}"
  when: not cluster_domain.endswith(".local")

- name: publish SPF records
  hetzner.hcloud.zone_rrset:
    api_token: "{{ lookup('hashivault', external_dns_hetzner_vault_secret_name, 'api_token', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) }}"
    zone: "{{ cluster_dns_zone }}"
    name: "{{ cluster_domain.removesuffix(cluster_dns_zone).removesuffix('.') }}"
    type: TXT
    records:
      - value: "{{ ('v=spf1 ip4:' + (groups['xdc'] | map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address'])) | join(' ip4:') + ' ~all') | hetzner.hcloud.txt_record }}"
  when: not cluster_domain.endswith(".local")

- name: publish DMARC records
  hetzner.hcloud.zone_rrset:
    api_token: "{{ lookup('hashivault', external_dns_hetzner_vault_secret_name, 'api_token', mount_point=vault_kv_mountpoint, version=2, url=vault_url, verify=kubeconfig_require_secure|default(true)) }}"
    zone: "{{ cluster_dns_zone }}"
    name: "_dmarc.{{ cluster_domain.removesuffix(cluster_dns_zone).removesuffix('.') }}"
    type: TXT
    records:
      - value: "{{ 'v=DMARC1; p=quarantine' | hetzner.hcloud.txt_record }}"
  when: not cluster_domain.endswith(".local")

- name: install docker-postfix
  kubernetes.core.helm:
    name: mail
    chart_ref: mail
    chart_repo_url: "{{ lookup('helm_chart', 'mail').repository }}"
    chart_version: "{{ lookup('helm_chart', 'mail').version }}"
    release_namespace: "{{ outbound_mail_k8s_namespace }}"
    release_values:
      config:
        general:
          ALLOWED_SENDER_DOMAINS: "{{ cluster_domain }}"
        postfix:
          myhostname: "{{ cluster_domain }}"
      extraVolumes:
        - name: dkim-keys
          secret:
            secretName: "{{ outbound_mail_dkim_k8s_secret }}"
      extraVolumeMounts:
        - name: dkim-keys
          mountPath: /etc/opendkim/keys
          readOnly: true
      nodeSelector:
        "coven.omelette.gay/location": "xdc"
# disabled for now - see https://github.com/omelette-gay/gitops/issues/358
#      metrics:
#        enabled: true
#        serviceMonitor:
#          enabled: true
    wait: true
