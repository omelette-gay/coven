- name: create redirect to new domain
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}-redirect"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: Middleware
    api_version: traefik.io/v1alpha1
    definition:
      spec:
        redirectRegex:
          regex: ".*"
          replacement: "{{ decommissioned_domain.redirect_target }}"
          permanent: true

- name: expose redirect in Traefik
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: Ingress
    api_version: networking.k8s.io/v1
    definition:
      metadata:
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd,{{ decommissioned_domains_k8s_namespace }}-{{ decommissioned_domain.name }}-redirect@kubernetescrd"
          cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
      spec:
        rules:
          - host: "{{ decommissioned_domain.domain }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: noop
                      port:
                        name: http
        tls:
          - hosts:
              - "{{ decommissioned_domain.domain }}"
            secretName: "{{ decommissioned_domain.name }}-tls"
