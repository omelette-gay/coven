- name: create certificate for decommissioned domain
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: Certificate
    api_version: cert-manager.io/v1
    definition:
      spec:
        secretName: "{{ decommissioned_domain.name }}-tls"
        dnsNames:
          - "{{ decommissioned_domain.domain }}"
        issuerRef:
          name: "{{ certmanager_default_issuer }}"
          kind: ClusterIssuer

- name: create redirect to new domain
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}-redirect"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: Middleware
    api_version: traefik.io/v1alpha1
    definition:
      spec:
        redirectRegex:
          regex: ".*"
          replacement: "{{ decommissioned_domain.redirect_target }}"
          permanent: true

- name: expose HTTP redirect in Traefik
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}-http"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    definition:
      spec:
        entryPoints:
          - web
        routes:
          - kind: Rule
            match: "Host(`{{ decommissioned_domain.domain }}`)"
            services:
              - name: noop@internal
                kind: TraefikService
            middlewares:
              - name: "{{ decommissioned_domain.name }}-redirect"

- name: expose HTTPS redirect in Traefik
  kubernetes.core.k8s:
    name: "{{ decommissioned_domain.name }}-https"
    namespace: "{{ decommissioned_domains_k8s_namespace }}"
    kind: IngressRoute
    api_version: traefik.io/v1alpha1
    definition:
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: "Host(`{{ decommissioned_domain.domain }}`)"
            services:
              - name: noop@internal
                kind: TraefikService
            middlewares:
              - name: "{{ decommissioned_domain.name }}-redirect"
        tls:
          secretName: "{{ decommissioned_domain.name }}-tls"
