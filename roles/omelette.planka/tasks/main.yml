---
- name: Create Planka k8s Namespace
  kubernetes.core.k8s:
    name: "{{ planka_k8s_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: check if secret exists in Vault with Secret Key for Planka
  hashivault_read:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ planka_vault_secret_key_name }}"
    version: 2
  ignore_errors: true
  register: planka_secret_key

- name: create secret in Vault for Planka secret key
  hashivault_secret:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    secret: "{{ planka_vault_secret_key_name }}"
    data:
      key: "{{ lookup('community.general.random_string', length=45) }}"
  when: planka_secret_key.failed

- name: create secret from Vault for Planka secret key
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "{{ planka_vault_secret_key_name }}"
      k8s_secret_name: "{{ planka_k8s_secret_key_name }}"
      k8s_namespace: "{{ planka_k8s_namespace }}"
      k8s_service_account_name: planka-secret-key
      vault_role_name: planka-secret-key

- name: create Keycloak client for Planka
  middleware_automation.keycloak.keycloak_client:
    client_id: "{{ planka_keycloak_client_name }}"
    realm: "{{ keycloak_realm }}"
    protocol: openid-connect
    standard_flow_enabled: true
    public_client: false
    root_url: "https://{{ planka_hostname }}"
    redirect_uris:
      - "https://{{ planka_hostname }}/oidc-callback"
    protocol_mappers:
      - name: client roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        consentRequired: false
        config:
          claim.name: groups
          multivalued: true
          userinfo.token.claim: true
          access.token.claim: true
          usermodel.clientRoleMapping.clientId: "{{ planka_keycloak_client_name }}"
  register: keycloak_planka_client

- name: create Planka admin role in Keycloak
  middleware_automation.keycloak.keycloak_role:
    realm: "{{ keycloak_realm }}"
    name: "{{ planka_keycloak_admin_role }}"
    client_id: "{{ planka_keycloak_client_name }}"
  register: keycloak_planka_admin_role

- name: associate Planka admin role with admins group in Keycloak
  middleware_automation.keycloak.keycloak_client_rolemapping:
    realm: "{{ keycloak_realm }}"
    group_name: "{{ keycloak_admin_group }}"
    client_id: "{{ planka_keycloak_client_name }}"
    roles:
      - name: "{{ planka_keycloak_admin_role }}"

- name: fetch Planka client secret from Keycloak
  middleware_automation.keycloak.keycloak_clientsecret_info:
    id: "{{ keycloak_planka_client.end_state.id }}"
    realm: "{{ keycloak_realm }}"
  no_log: true
  register: keycloak_planka_client_secret

- name: create Planka SSO secret
  kubernetes.core.k8s:
    name: "{{ planka_k8s_sso_secrets_name }}"
    namespace: "{{ planka_k8s_namespace }}"
    definition:
      apiVersion: v1
      kind: Secret
      data:
        clientId: "{{ keycloak_planka_client.end_state.clientId|b64encode }}"
        clientSecret: "{{ keycloak_planka_client_secret.clientsecret_info.value|b64encode }}"

- name: sync GCP backup service account secret
  include_role:
    name: omelette.secrets
    tasks_from: create_k8s_secret
  vars:
    vault_k8s_secret:
      vault_secret_name: "backups/service-account-key"
      k8s_secret_name: "{{ planka_k8s_backup_creds_secret }}"
      k8s_namespace: "{{ planka_k8s_namespace }}"
      k8s_service_account_name: "planka-gcp-backup-creds"
      vault_role_name: "planka-gcp-backup-creds"

- name: install database for Planka
  kubernetes.core.helm:
    name: db
    chart_ref: cluster
    chart_repo_url: "{{ lookup('helm_chart', 'cluster').repository }}"
    chart_version: "{{ lookup('helm_chart', 'cluster').version }}"
    release_namespace: "{{ planka_k8s_namespace }}"
    release_values:
      version:
        postresql: "{{ cnpg_postgres_major_version }}"
      cluster:
        instances: 2
        initdb:
          database: planka
        monitoring:
          enabled: true
      backups:
        enabled: true
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
        provider: google
        google:
          bucket: "{{ gcp_backup_bucket_name }}"
          path: /cnpg/planka/
        secret:
          create: false
          name: "{{ planka_k8s_backup_creds_secret }}"
        scheduledBackups:
          - name: daily-backup
            schedule: "0 0 8,20 * * *"
            backupOwnerReference: self
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io

- name: Install Planka
  kubernetes.core.helm:
    name: planka
    chart_ref: planka
    chart_repo_url: "{{ lookup('helm_chart', 'planka').repository }}"
    chart_version: "{{ lookup('helm_chart', 'planka').version }}"
    release_namespace: "{{ planka_k8s_namespace }}"
    release_values:
      existingSecretkeySecret: "{{ planka_k8s_secret_key_name }}"
      persistence:
        enabled: true
      ingress:
        enabled: true
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
          cert-manager.io/cluster-issuer: "{{ certmanager_default_issuer }}"
        hosts:
          - host: "{{ planka_hostname }}"
            paths:
              - path: /
                pathType: ImplementationSpecific
        tls:
          - secretName: planka-tls
            hosts:
              - "{{ planka_hostname }}"
      oidc:
        enabled: true
        existingSecret: "{{ planka_k8s_sso_secrets_name }}"
        issuerUrl: "{{ keycloak_url }}/realms/{{ keycloak_realm }}"
        scopes:
          - openid
        admin:
          roles:
            - "{{ planka_keycloak_admin_role }}"
      postgresql:
        enabled: false # use externally managed database, not the built-in one
      existingDburlSecret: db-cluster-app

- name: mark Planka storage for Longhorn backup
  kubernetes.core.k8s:
    state: patched
    kind: PersistentVolumeClaim
    name: planka
    namespace: "{{ planka_k8s_namespace }}"
    definition:
      metadata:
        labels: "{{ {'recurring-job.longhorn.io/source': 'enabled', 'recurring-job.longhorn.io/' + longhorn_k8s_recurring_job_name: 'enabled'} }}"

- name: monitor Planka
  kubernetes.core.k8s:
    name: planka-https
    namespace: "{{ planka_k8s_namespace }}"
    api_version: monitoring.coreos.com/v1
    kind: Probe
    definition:
      spec:
        interval: 60s
        module: http_2xx
        prober:
          url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
          path: /probe
        targets:
          staticConfig:
            static:
              - "https://{{ planka_hostname }}/login"
