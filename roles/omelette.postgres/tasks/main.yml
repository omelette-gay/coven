- name: install cloudnative-pg
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cloudnative-pg
    chart_repo_url: "{{ lookup('helm_chart', 'cloudnative-pg').repository }}"
    chart_version: "{{ lookup('helm_chart', 'cloudnative-pg').version }}"
    release_namespace: "{{ cnpg_k8s_namespace }}"
    create_namespace: true
    release_values:
      monitoring:
        podMonitorEnabled: true
        grafanaDashboard:
          create: true
    wait: true
  notify: restart Grafana

- name: install barman-cloud plugin for cnpg backups
  kubernetes.core.helm:
    name: plugin-barman-cloud
    chart_ref: plugin-barman-cloud
    chart_repo_url: "{{ lookup('helm_chart', 'plugin-barman-cloud').repository }}"
    chart_version: "{{ lookup('helm_chart', 'plugin-barman-cloud').version }}"
    release_namespace: "{{ cnpg_k8s_namespace }}"
    wait: true
