- name: install strimzi-kafka-operator
  kubernetes.core.helm:
    name: strimzi-kafka-operator
    chart_ref: strimzi-kafka-operator
    chart_repo_url: "{{ lookup('helm_chart', 'strimzi-kafka-operator').repository }}"
    chart_version: "{{ lookup('helm_chart', 'strimzi-kafka-operator').version }}"
    release_namespace: "{{ kafka_k8s_namespace }}"
    create_namespace: true
    release_values:
      dashboards:
        enabled: true
    wait: true
  notify: restart Grafana
