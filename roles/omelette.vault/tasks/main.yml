- name: install Vault
  include_tasks: install.yml

- name: configure Vault policies
  include_tasks: policies.yml

- name: enable login with Keycloak
  include_tasks: enable_keycloak_login.yml

- name: enable KV secrets engine
  hashivault_secret_engine:
    url: "{{ vault_url }}"
    verify: "{{ kubeconfig_require_secure|default(true) }}"
    name: "{{ vault_kv_mountpoint }}"
    backend: kv
    options:
      version: 2
